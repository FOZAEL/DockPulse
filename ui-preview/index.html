<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DockPulse UI Preview</title>
<!--
  DockPulse UI preview (approximate). Double-click this file to open it in a browser; no build needed.

  - Texts, tags, icons and layout mirror DockBands/*.cs, Pages/*.cs and Services/NetworkChartRenderer.cs.
  - All numbers are fake: see the MOCK DATA section in the script. "Scenario" switches between data sets.
  - PowerToys Command Palette draws the real UI, so spacing and fonts here are close, not exact.
  - Icons use the Windows "Segoe Fluent Icons" font with the same glyph codes as the C# IconInfo values.

  Workflow for UI changes: edit this file first, review it in the browser, then change the C# to match.
-->
<style>
  :root {
    --desk-a: #dbe6f6; --desk-b: #a9c1e8; --desk-c: #eef2f9;
    --surface: rgba(249, 249, 249, .95);
    --stroke: rgba(0, 0, 0, .08); --stroke-strong: rgba(0, 0, 0, .15);
    --text: #1b1b1b; --text-2: rgba(0, 0, 0, .62); --text-3: rgba(0, 0, 0, .45);
    --row-hover: rgba(0, 0, 0, .035); --row-sel: rgba(0, 0, 0, .065);
    --accent: #005fb8;
    --tag-bg: rgba(0, 0, 0, .035); --tag-stroke: rgba(0, 0, 0, .1);
    --dock: rgba(243, 243, 243, .88); --menu: #fbfbfb; --kbd: rgba(0, 0, 0, .06);
    --toolbar: #ffffff; --input: rgba(255, 255, 255, .8);
    --shadow: 0 18px 50px rgba(0, 0, 0, .18), 0 2px 8px rgba(0, 0, 0, .08);
    --md-table: rgba(0, 0, 0, .03);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --desk-a: #0d1b36; --desk-b: #1e2f57; --desk-c: #0b0d14;
      --surface: rgba(32, 32, 32, .95);
      --stroke: rgba(255, 255, 255, .08); --stroke-strong: rgba(255, 255, 255, .15);
      --text: #ffffff; --text-2: rgba(255, 255, 255, .72); --text-3: rgba(255, 255, 255, .5);
      --row-hover: rgba(255, 255, 255, .04); --row-sel: rgba(255, 255, 255, .075);
      --accent: #60cdff;
      --tag-bg: rgba(255, 255, 255, .05); --tag-stroke: rgba(255, 255, 255, .1);
      --dock: rgba(32, 32, 32, .84); --menu: #2c2c2c; --kbd: rgba(255, 255, 255, .08);
      --toolbar: #1c1c1c; --input: rgba(255, 255, 255, .05);
      --shadow: 0 18px 50px rgba(0, 0, 0, .55), 0 2px 8px rgba(0, 0, 0, .3);
      --md-table: rgba(255, 255, 255, .03);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --desk-a: #0d1b36; --desk-b: #1e2f57; --desk-c: #0b0d14;
    --surface: rgba(32, 32, 32, .95);
    --stroke: rgba(255, 255, 255, .08); --stroke-strong: rgba(255, 255, 255, .15);
    --text: #ffffff; --text-2: rgba(255, 255, 255, .72); --text-3: rgba(255, 255, 255, .5);
    --row-hover: rgba(255, 255, 255, .04); --row-sel: rgba(255, 255, 255, .075);
    --accent: #60cdff;
    --tag-bg: rgba(255, 255, 255, .05); --tag-stroke: rgba(255, 255, 255, .1);
    --dock: rgba(32, 32, 32, .84); --menu: #2c2c2c; --kbd: rgba(255, 255, 255, .08);
    --toolbar: #1c1c1c; --input: rgba(255, 255, 255, .05);
    --shadow: 0 18px 50px rgba(0, 0, 0, .55), 0 2px 8px rgba(0, 0, 0, .3);
    --md-table: rgba(255, 255, 255, .03);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--desk-c);
    color: var(--text);
    font: 14px/1.4 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    display: flex; flex-direction: column;
  }
  .ic {
    font-family: "Segoe Fluent Icons", "Segoe MDL2 Assets";
    font-style: normal; font-weight: normal; line-height: 1;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .ic svg { width: 1em; height: 1em; display: block; flex: none; }
  button { font: inherit; color: inherit; }

  /* ---------- preview toolbar (not part of DockPulse) ---------- */
  .toolbar {
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px;
    padding: 10px 16px; background: var(--toolbar);
    border-bottom: 1px solid var(--stroke);
  }
  .brand { font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .badge {
    font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px;
    background: var(--tag-bg); border: 1px solid var(--tag-stroke); color: var(--text-2);
  }
  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; margin-left: auto; }
  .controls label { display: flex; align-items: center; gap: 6px; color: var(--text-2); font-size: 13px; }
  .controls select, .controls input {
    font: inherit; font-size: 13px; color: var(--text);
    background: var(--input); border: 1px solid var(--stroke-strong); border-radius: 6px; padding: 4px 8px;
  }
  .seg { display: inline-flex; border: 1px solid var(--stroke-strong); border-radius: 6px; overflow: hidden; }
  .seg button {
    border: 0; background: transparent; padding: 4px 10px; font-size: 13px; cursor: pointer; color: var(--text-2);
  }
  .seg button[aria-pressed="true"] { background: var(--row-sel); color: var(--text); font-weight: 600; }

  /* ---------- desktop + dock ---------- */
  .desktop {
    flex: 1; position: relative; overflow: auto;
    background:
      radial-gradient(1200px 600px at 15% 0%, var(--desk-b), transparent 60%),
      radial-gradient(900px 500px at 100% 100%, var(--desk-a), transparent 60%),
      var(--desk-c);
    padding: 0 16px 24px;
  }
  .dock {
    position: sticky; top: 0; z-index: 2;
    display: flex; gap: 4px; align-items: stretch; flex-wrap: wrap;
    margin: 0 -16px 28px; padding: 4px 10px;
    background: var(--dock); backdrop-filter: blur(24px);
    border-bottom: 1px solid var(--stroke);
  }
  .band {
    display: flex; align-items: center; gap: 8px;
    border: 0; background: transparent; border-radius: 6px;
    padding: 4px 10px; cursor: pointer; text-align: left; min-height: 40px;
  }
  .band:hover { background: var(--row-hover); }
  .band:active, .band.open { background: var(--row-sel); }
  .band .ic { font-size: 16px; width: 20px; }
  .band .ic svg { width: 16px; height: 16px; }
  .band .t { font-size: 12px; font-weight: 600; white-space: nowrap; }
  .band .s { font-size: 11px; color: var(--text-2); white-space: nowrap; }
  .band-group { display: inline-flex; align-items: stretch; gap: 1px; border-radius: 6px; }
  .band-group .band { border-radius: 6px; }
  .band.band-icon { padding: 4px 8px; gap: 0; }
  .band.band-icon .ic { font-size: 13px; width: 16px; }
  .band.band-icon .ic svg { width: 13px; height: 13px; }

  /* ---------- command palette window ---------- */
  .palette {
    width: min(860px, 100%); height: 540px; margin: 0 auto;
    display: flex; flex-direction: column;
    background: var(--surface); backdrop-filter: blur(30px);
    border: 1px solid var(--stroke-strong); border-radius: 8px;
    box-shadow: var(--shadow); overflow: hidden;
  }
  .pal-top {
    display: flex; align-items: center; gap: 8px; padding: 10px 12px;
    border-bottom: 1px solid var(--stroke);
  }
  .pal-top .lead {
    width: 32px; height: 32px; border: 0; border-radius: 4px; background: transparent;
    font-size: 14px; color: var(--text-2); flex: none;
  }
  .pal-top .lead svg { width: 16px; height: 16px; }
  .pal-top button.lead { cursor: pointer; }
  .pal-top button.lead:hover { background: var(--row-hover); color: var(--text); }
  .pal-top input {
    flex: 1; min-width: 0; font: inherit; font-size: 16px; color: var(--text);
    background: transparent; border: 0; outline: none; padding: 6px 4px;
  }
  .pal-top input::placeholder { color: var(--text-3); }
  .pal-top input:disabled { cursor: default; }
  .pal-body { flex: 1; min-height: 0; display: flex; }
  .list { flex: 1; min-width: 0; overflow-y: auto; padding: 4px; }
  .list.with-details { flex: 1 1 auto; border-right: 1px solid var(--stroke); }
  .row {
    position: relative; display: flex; align-items: center; gap: 12px;
    padding: 8px 12px; border-radius: 4px; cursor: default; min-height: 52px;
  }
  .row:hover { background: var(--row-hover); }
  .row.sel { background: var(--row-sel); }
  .row.sel::before {
    content: ""; position: absolute; left: 0; top: 50%; width: 3px; height: 16px;
    margin-top: -8px; border-radius: 2px; background: var(--accent);
  }
  .row > .ic { font-size: 18px; width: 24px; flex: none; color: var(--text); }
  .row > .ic svg { width: 18px; height: 18px; }
  .row .txt { flex: 1; min-width: 0; }
  .row .ti { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .su { font-size: 12px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tags { display: flex; gap: 4px; flex: none; flex-wrap: nowrap; }
  .tag {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 11.5px; padding: 1px 7px; border-radius: 4px; white-space: nowrap;
    background: var(--tag-bg); border: 1px solid var(--tag-stroke); color: var(--text-2);
  }
  .tag .ic { font-size: 11px; }
  .tag.ok { background: rgba(16, 185, 129, .14); border-color: rgba(16, 185, 129, .38); color: #10b981; }
  .tag.accent { background: rgba(56, 189, 248, .14); border-color: rgba(56, 189, 248, .38); color: var(--accent); }
  .tag.warn { background: rgba(245, 158, 11, .15); border-color: rgba(245, 158, 11, .4); color: #d97706; }
  .tag.danger { background: rgba(244, 63, 94, .15); border-color: rgba(244, 63, 94, .42); color: #e11d48; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .tag.warn { color: #fbbf24; }
    :root:not([data-theme="light"]) .tag.danger { color: #fb7185; }
    :root:not([data-theme="light"]) .tag.ok { color: #34d399; }
  }
  :root[data-theme="dark"] .tag.warn { color: #fbbf24; }
  :root[data-theme="dark"] .tag.danger { color: #fb7185; }
  :root[data-theme="dark"] .tag.ok { color: #34d399; }
  .empty { padding: 32px; text-align: center; color: var(--text-3); }
  .sec-hdr {
    font-size: 12px; font-weight: 600; color: var(--text-2);
    padding: 10px 12px 4px; margin-top: 6px; border-top: 1px solid var(--stroke);
  }
  .sec-hdr:first-child { margin-top: 0; border-top: 0; padding-top: 6px; }

  /* Same content width as Command Palette's details pane at its default size (~345 px); wider images get clipped */
  .details { flex: 0 0 381px; min-width: 0; overflow-y: auto; overflow-x: hidden; padding: 16px 18px; }
  .details h2 { font-size: 18px; font-weight: 600; margin: 0 0 10px; }

  .content { flex: 1; overflow-y: auto; padding: 16px 20px; display: flex; flex-direction: column; gap: 10px; }
  .chart { display: block; width: 100%; height: auto; }
  .dash-chart { display: block; width: 100%; max-width: 480px; height: auto; margin: 0 auto; }
  .dash-md { max-width: 480px; width: 100%; margin: 0 auto; }
  .pomo-card { display: block; width: 100%; max-width: 480px; height: auto; margin: 0 auto; border-radius: 12px; }
  .prayer-card-wrap { padding: 6px 8px 4px; }
  .prayer-card { display: block; width: 100%; height: auto; border-radius: 12px; cursor: pointer; }

  /* Adaptive Card FormContent mock */
  .form-card {
    background: var(--input); border: 1px solid var(--stroke); border-radius: 8px;
    padding: 14px 16px; display: flex; flex-direction: column; gap: 12px;
  }
  .form-card.compact { padding: 10px 12px; gap: 8px; max-width: 480px; width: 100%; margin: 0 auto; }
  .form-title { font-size: 15px; font-weight: 600; margin: 0; }
  .form-desc { font-size: 12.5px; color: var(--text-2); margin: 0; }
  .form-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .form-field { display: flex; flex-direction: column; gap: 5px; }
  .form-label { font-size: 12.5px; font-weight: 600; color: var(--text-2); }
  .form-input {
    font: inherit; font-size: 13.5px; color: var(--text);
    background: var(--surface); border: 1px solid var(--stroke-strong); border-radius: 6px; padding: 7px 10px;
  }
  .form-input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .form-toggle { display: flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer; }
  .form-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .form-card.compact .form-actions { justify-content: center; }
  /* Calendar: buttons start at the same left edge as the year inside the card (20 px) */
  .form-card.compact.start { padding-left: 19px; }
  .form-card.compact.start .form-actions { justify-content: flex-start; }
  .form-btn {
    display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--stroke-strong);
    background: var(--tag-bg); color: var(--text); border-radius: 6px; padding: 6px 12px;
    font-size: 13px; font-weight: 500; cursor: pointer;
  }
  .form-btn:hover { background: var(--row-sel); }
  .form-btn.primary { background: var(--accent); border-color: transparent; color: #ffffff; font-weight: 600; }
  :root[data-theme="dark"] .form-btn.primary { color: #0b0d14; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .form-btn.primary { color: #0b0d14; } }
  .form-btn.primary:hover { filter: brightness(1.08); }
  .form-err { font-size: 12px; color: #e11d48; margin: 0; }

  .md { font-size: 13.5px; color: var(--text); }
  .md p { margin: 0 0 10px; }
  .md h3 { font-size: 15px; font-weight: 600; margin: 8px 0 6px; }
  .md em { color: var(--text-2); }
  .md table { border-collapse: collapse; width: 100%; margin: 0 0 10px; font-size: 13px; }
  .md th, .md td { padding: 5px 8px; border-bottom: 1px solid var(--stroke); }
  .md th { font-weight: 600; background: var(--md-table); }

  .pal-bar {
    display: flex; align-items: center; gap: 8px; padding: 6px 10px 6px 14px;
    border-top: 1px solid var(--stroke); font-size: 12.5px; color: var(--text-2); min-height: 44px;
  }
  .bar-left { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1; }
  .bar-left .ic svg { width: 14px; height: 14px; }
  .bar-left span:last-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar-right { display: flex; align-items: center; gap: 4px; flex: none; }
  .bar-btn {
    display: inline-flex; align-items: center; gap: 6px; border: 0; background: transparent;
    padding: 5px 8px; border-radius: 4px; cursor: pointer; color: var(--text);
  }
  .bar-btn:hover { background: var(--row-hover); }
  .bar-btn[hidden] { display: none; }
  kbd {
    font: inherit; font-size: 11px; padding: 1px 6px; border-radius: 4px;
    background: var(--kbd); border: 1px solid var(--stroke); color: var(--text-2);
  }
  .sep { width: 1px; height: 18px; background: var(--stroke-strong); margin: 0 4px; }

  /* ---------- context menu + toast ---------- */
  .menu {
    position: fixed; z-index: 20; min-width: 240px; max-width: 360px; padding: 4px;
    background: var(--menu); border: 1px solid var(--stroke-strong); border-radius: 8px;
    box-shadow: var(--shadow);
  }
  .menu[hidden] { display: none; }
  .menu button {
    display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
    border: 0; background: transparent; padding: 7px 10px; border-radius: 4px; cursor: pointer; font-size: 13px;
  }
  .menu button:hover, .menu button.sel { background: var(--row-sel); }
  .menu .ic { width: 16px; font-size: 14px; color: var(--text-2); }
  .menu .ic svg { width: 14px; height: 14px; }
  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 30;
    background: var(--menu); color: var(--text); border: 1px solid var(--stroke-strong);
    border-radius: 6px; padding: 8px 14px; font-size: 13px; box-shadow: var(--shadow); max-width: calc(100% - 32px);
  }
  .toast[hidden] { display: none; }
  .win-notif {
    position: fixed; right: 20px; bottom: 20px; z-index: 35; width: 340px;
    background: var(--menu); color: var(--text); border: 1px solid var(--stroke-strong);
    border-radius: 8px; padding: 12px 14px; box-shadow: var(--shadow);
  }
  .win-notif[hidden] { display: none; }
  .win-notif-top { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-2); margin-bottom: 6px; }
  .win-notif-top button { margin-left: auto; border: 0; background: transparent; cursor: pointer; color: var(--text-2); font-size: 15px; padding: 0 4px; border-radius: 4px; }
  .win-notif-top button:hover { background: var(--row-hover); color: var(--text); }
  .win-notif-title { font-weight: 600; font-size: 14px; margin-bottom: 2px; }
  .win-notif-body { font-size: 12.5px; color: var(--text-2); }
  .hint { text-align: center; color: var(--text-2); font-size: 12.5px; margin: 14px 0 0; }

  @media (max-width: 640px) {
    .palette { height: 600px; }
    .pal-body.split { flex-direction: column; }
    .list.with-details { flex: 0 0 50%; border-right: 0; border-bottom: 1px solid var(--stroke); }
    .tags .tag:nth-child(n+2) { display: none; }
  }
</style>
</head>
<body>
<header class="toolbar">
  <div class="brand">DockPulse UI Preview <span class="badge">approximate · fake data</span></div>
  <div class="controls">
    <div class="seg" id="themeSeg" role="group" aria-label="Theme">
      <button data-theme-btn="auto" aria-pressed="true">Auto</button>
      <button data-theme-btn="light" aria-pressed="false">Light</button>
      <button data-theme-btn="dark" aria-pressed="false">Dark</button>
    </div>
    <label>Scenario
      <select id="scenario">
        <option value="normal">Normal</option>
        <option value="net_dashboard">Network: dashboard (this month)</option>
        <option value="football_live">Football: Man United playing (67')</option>
        <option value="football_ft">Football: full time</option>
        <option value="football_none">Football: no teams yet</option>
        <option value="cal_persian">Calendar: Persian main (Hamal names)</option>
        <option value="cal_qamari">Calendar: Qamari main</option>
        <option value="loc_vpn">Location: on a VPN (Frankfurt)</option>
        <option value="loc_offline">Location: offline</option>
        <option value="ai_compare">AI Usage: compare dashboard</option>
        <option value="ai_dock_antigravity">AI Usage: Dock shows Antigravity</option>
        <option value="ai_limit">AI Usage: Claude 0% (limit reached)</option>
        <option value="ai_nosignin">AI Usage: Codex no sessions, agy not installed</option>
        <option value="bt_fallback">Bluetooth: pinned device disconnected</option>
        <option value="coffee_due">Daily checklist: Coffee time (10:05)</option>
        <option value="pomodoro_running">Pomodoro: running live (Focus 2/4)</option>
        <option value="prayertime">Prayer time reached (notification)</option>
        <option value="tehran">Tehran / Jafari method</option>
        <option value="low">Low battery + charging</option>
        <option value="nodevices">No wireless devices</option>
        <option value="notraffic">No network traffic yet</option>
        <option value="folder_missing">Working folder missing</option>
      </select>
    </label>
    <label>Clock <input type="time" id="clock" value="14:11"></label>
  </div>
</header>

<main class="desktop">
  <nav class="dock" id="dock" aria-label="Dock"></nav>

  <section class="palette" id="palette" aria-label="Command Palette">
    <div class="pal-top" id="palTop"></div>
    <div class="pal-body" id="palBody"></div>
    <div class="pal-bar">
      <div class="bar-left"><span class="ic" id="barIcon"></span><span id="barTitle"></span></div>
      <div class="bar-right">
        <button class="bar-btn" id="primaryBtn"><span id="primaryName"></span><kbd>↵</kbd></button>
        <span class="sep" id="barSep"></span>
        <button class="bar-btn" id="actionsBtn">Actions <kbd>Ctrl</kbd><kbd>K</kbd></button>
      </div>
    </div>
  </section>

  <p class="hint">Click a Dock band to open its page · click ▶/⏸ on Pomodoro to start/pause · right-click a band for its menu · click selects a row, double-click or Enter runs it · Esc goes back</p>
</main>

<div class="menu" id="menu" role="menu" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>
<div class="win-notif" id="winNotif" role="alert" hidden>
  <div class="win-notif-top">
    <span class="ic" id="wnIcon"></span>
    <span>DockPulse · Windows Notification</span>
    <button id="wnClose" title="Dismiss" aria-label="Dismiss">✕</button>
  </div>
  <div class="win-notif-title" id="wnTitle"></div>
  <div class="win-notif-body" id="wnBody"></div>
</div>

<script>
"use strict";

/* =====================================================================
   Formatting helpers: ports of the C# formatters, so texts match
   ===================================================================== */
const KB = 1024, MB = KB * 1024, GB = MB * 1024;
const KBPS = 1000, MBPS = KBPS * 1000, GBPS = MBPS * 1000;
const pad2 = n => String(n).padStart(2, "0");
const hhmm = mins => pad2(Math.floor(((mins % 1440) + 1440) % 1440 / 60)) + ":" + pad2(((mins % 60) + 60) % 60);
const deg = x => String(Number(x.toFixed(1)));               // C# "0.#"
const fixed2 = x => x.toFixed(2);                              // C# "0.00"

// NetworkUsageService.FormatBytes
function formatBytes(bytes) {
  const units = ["B", "KB", "MB", "GB", "TB"];
  let v = bytes, i = 0;
  while (v >= 1024 && i < units.length - 1) { v /= 1024; i++; }
  return v.toFixed(i >= 3 ? 2 : (i >= 2 ? 1 : 0)) + " " + units[i];
}
// NetworkChartRenderer.FormatShortAxis
function formatShortAxis(bytes) {
  if (bytes === 0) return "0";
  const units = ["B", "KB", "MB", "GB", "TB"];
  let v = bytes, i = 0;
  while (v >= 1024 && i < units.length - 1) { v /= 1024; i++; }

const aiLogoCache = new Map();
function getAiLogoImage(id, color) {
  const raw = AI_LOGOS[id];
  if (!raw) return null;
  const key = id + "|" + color;
  let entry = aiLogoCache.get(key);
  if (entry) return entry;
  const svg = raw
    .replace(/<svg\b/, '<svg width="64" height="64"')
    .replace(/currentColor/g, color);
  const img = new Image();
  entry = { img, ready: false, waiters: [] };
  aiLogoCache.set(key, entry);
  img.onload = () => {
    entry.ready = true;
    const fns = entry.waiters.splice(0);
    for (const fn of fns) fn();
  };
  img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
  return entry;
}
function drawAiLogo(ctx, id, x, y, size, color, onLoad) {
  const entry = getAiLogoImage(id, color);
  if (!entry) return;
  if (entry.ready && entry.img.naturalWidth > 0) {
    ctx.drawImage(entry.img, x, y, size, size);
  } else if (onLoad) {
    entry.waiters.push(onLoad);
  }
}

function seeded(seed) {
  return () => {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function initNetLive(zero) {
  const rnd = seeded(42);
  let down = 14.5 * MBPS, up = 1.4 * MBPS, burstLeft = 0;
  const next = () => {
    if (zero) return { down: 0, up: 0 };
    if (burstLeft > 0) {
      burstLeft--;
      down = Math.min(46 * MBPS, Math.max(20 * MBPS, down + (rnd() - 0.35) * 8 * MBPS));
    } else if (rnd() < 0.08) {
      burstLeft = 2 + Math.floor(rnd() * 3);
      down = Math.min(44 * MBPS, down + (12 + rnd() * 14) * MBPS);
    } else {
      down = down + (12 * MBPS - down) * 0.14 + (rnd() - 0.5) * 9 * MBPS;
      down = Math.min(40 * MBPS, Math.max(2 * MBPS, down));
    }
    up = up + (1.3 * MBPS - up) * 0.16 + (rnd() - 0.5) * 1.4 * MBPS;
    up = Math.min(4 * MBPS, Math.max(0.2 * MBPS, up));
    return { down: Math.round(down), up: Math.round(up) };
  };
  const samples = [];
  for (let i = 0; i < 30; i++) samples.push(next());
  return { samples, next };
}

/* Calendar band helpers (Services/CalendarService.cs). Week numbers are ISO 8601; weeks start on Monday
   in the preview, and on Windows' "first day of week" setting in the C#. */
const MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
const WEEKDAYS_SHORT = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const WEEKDAYS_LONG = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
function isoWeek(d) {
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const dow = t.getUTCDay() || 7;
  t.setUTCDate(t.getUTCDate() + 4 - dow);
  const y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
  return Math.ceil(((t - y0) / 86400000 + 1) / 7);
}
function dayOfYear(d) { return Math.round((new Date(d.getFullYear(), d.getMonth(), d.getDate()) - new Date(d.getFullYear(), 0, 1)) / 86400000) + 1; }
function daysInYear(y) { return (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0 ? 366 : 365; }
function isoDate(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; }
function longDate(d) { return `${WEEKDAYS_LONG[d.getDay()]}, ${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`; }

/* Persian (Solar Hijri) and Qamari (Lunar Hijri, Umm al-Qura) dates: PersianCalendar / UmAlQuraCalendar in C# */
const PERSIAN_MONTHS = {
  afghan: ["Hamal", "Sawr", "Jawza", "Saratan", "Asad", "Sonbola", "Mizan", "Aqrab", "Qaws", "Jadi", "Dalw", "Hut"],
  iranian: ["Farvardin", "Ordibehesht", "Khordad", "Tir", "Mordad", "Shahrivar", "Mehr", "Aban", "Azar", "Dey", "Bahman", "Esfand"],
};
const QAMARI_MONTHS = ["Muharram", "Safar", "Rabi al-Awwal", "Rabi al-Thani", "Jumada al-Ula", "Jumada al-Akhirah", "Rajab", "Shaban", "Ramadan", "Shawwal", "Dhu al-Qadah", "Dhu al-Hijjah"];
function calendarParts(d, calendar) {
  const parts = new Intl.DateTimeFormat(`en-u-ca-${calendar}-nu-latn`, { day: "numeric", month: "numeric", year: "numeric" }).formatToParts(d);
  const get = t => parseInt(parts.find(p => p.type === t).value, 10);
  return { day: get("day"), month: get("month"), year: get("year") };
}
function persianDate(d) { return calendarParts(d, "persian"); }
function qamariDate(d) {
  const shifted = new Date(d.getFullYear(), d.getMonth(), d.getDate() + state.calendar.qamariAdjust);
  return calendarParts(shifted, "islamic-umalqura");
}
function formatPersian(d) { const p = persianDate(d); return `${p.day} ${PERSIAN_MONTHS[state.calendar.persianNames][p.month - 1]} ${p.year}`; }
function formatQamari(d) { const q = qamariDate(d); return `${q.day} ${QAMARI_MONTHS[q.month - 1]} ${q.year}`; }
function datePartsIn(kind, d) {
  if (kind === "persian") return persianDate(d);
  if (kind === "qamari") return qamariDate(d);
  return { day: d.getDate(), month: d.getMonth() + 1, year: d.getFullYear() };
}
function monthNamesFor(kind) {
  if (kind === "persian") return PERSIAN_MONTHS[state.calendar.persianNames];
  if (kind === "qamari") return QAMARI_MONTHS;
  return MONTHS;
}
function formatIn(kind, d) {
  const p = datePartsIn(kind, d);
  return `${p.day} ${monthNamesFor(kind)[p.month - 1]} ${p.year}`;
}

function buildNetwork() {
  const now = nowDate();
  const curHour = now.getHours(), minute = now.getMinutes(), curDay = now.getDate();
  const daysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
  const none = state.scenario === "notraffic";
  const rnd = seeded(7);

  const hourly = [];
  for (let h = 0; h < 24; h++) {
    const a = rnd(), b = rnd();
    let total = 0;
    if (!none && h <= curHour) {
      total = (h >= 8 ? 0.25 + a * 1.1 : 0.02 + a * 0.12) * GB;
      if (h === curHour) total *= Math.max(0.05, minute / 60);
    }
    const rx = Math.round(total * (0.84 + b * 0.08));
    hourly.push({ label: pad2(h), rx, tx: Math.round(total) - rx });
  }
  const todayRx = hourly.reduce((s, x) => s + x.rx, 0), todayTx = hourly.reduce((s, x) => s + x.tx, 0);

  const daily = [];
  for (let d = 1; d <= daysInMonth; d++) {
    const a = rnd(), b = rnd();
    let rx = 0, tx = 0;
    if (!none && d < curDay) {
      const total = (1.3 + a * 2.4) * GB;
      rx = Math.round(total * (0.84 + b * 0.08)); tx = Math.round(total) - rx;
    } else if (d === curDay) { rx = todayRx; tx = todayTx; }
    daily.push({ label: String(d), rx, tx });
  }
  const monthRx = daily.reduce((s, x) => s + x.rx, 0), monthTx = daily.reduce((s, x) => s + x.tx, 0);

  const adapters = none ? [] : [
    { name: "HomeNet-5G", active: true, share: 0.86 },
    { name: "Ethernet", active: false, share: 0.14 },
  ].map(ad => {
    const days = daily.map((x, i) => {
      const share = (i + 1 === curDay) ? (ad.active ? 1 : 0) : ad.share;
      return { label: x.label, rx: Math.round(x.rx * share), tx: Math.round(x.tx * share) };
    });
    const today = days[curDay - 1];
    const rxM = days.reduce((s, x) => s + x.rx, 0), txM = days.reduce((s, x) => s + x.tx, 0);
    return {
      name: ad.name, active: ad.active, daily: days,
      rxToday: today.rx, txToday: today.tx, totalToday: today.rx + today.tx,
      rxMonth: rxM, txMonth: txM, totalMonth: rxM + txM,
    };
  });

  const updated = new Date(now.getTime() - 83 * 1000);
  return {
    hourly, daily, curHour, curDay, adapters,
    monthAbbr: now.toLocaleString("en-US", { month: "short" }),
    monthLabel: now.toLocaleString("en-US", { month: "short" }) + " " + now.getFullYear(),
    rxToday: todayRx, txToday: todayTx, totalToday: todayRx + todayTx,
    rxMonth: monthRx, txMonth: monthTx, totalMonth: monthRx + monthTx,
    updatedAt: `${pad2(updated.getHours())}:${pad2(updated.getMinutes())}:${pad2(updated.getSeconds())}`,
  };
}

function buildPrayer() {
  const region = REGIONS.find(r => r.id === state.prayer.regionId);
  const method = METHODS.find(m => m.id === state.prayer.methodId);
  const school = state.prayer.asr;
  const p = profileFor(region);
  const now = state.clock;
  const asrT = school === "Hanafi" ? p.asrHan : p.asrStd;
  const maghrib = method.twilightMaghrib ? p.sunset + 19 : p.sunset;
  const isha = method.ishaMin ? p.sunset + method.ishaMin : (method.twilightMaghrib ? p.ishaTwi : p.ishaStd);
  const entries = [
    { name: "Fajr", t: p.fajr, obligatory: true },
    { name: "Sunrise", t: p.sunrise, obligatory: false },
    { name: "Dhuhr", t: p.dhuhr, obligatory: true },
    { name: "Asr", t: asrT, obligatory: true },
    ...(method.twilightMaghrib ? [{ name: "Sunset", t: p.sunset, obligatory: false }] : []),
    { name: "Maghrib", t: maghrib, obligatory: true },
    { name: "Isha", t: isha, obligatory: true },
  ];
  const obligatory = entries.filter(e => e.obligatory);
  let next = obligatory.find(e => e.t > now);
  let tomorrow = false;
  if (!next) { next = obligatory[0]; tomorrow = true; }
  const current = [...obligatory].reverse().find(e => e.t <= now);
  for (const e of entries) {
    e.isPassed = e.t <= now;
    e.isNext = !tomorrow && e === next;
    e.isCurrent = e === current;
  }
  const exactNowPrayer = obligatory.find(e => e.t === now);
  const until = (tomorrow ? next.t + 1440 : next.t) - now;
  const cardPrayerName = exactNowPrayer ? exactNowPrayer.name : next.name;
  const cardLabel = exactNowPrayer ? "Prayer Time" : "Time Left";
  const cardPill = exactNowPrayer ? `Now • ${hhmm(exactNowPrayer.t)}` : `${Math.floor(until / 60)} Hour ${until % 60} min`;
  const milestones = [
    { key: "fajr", name: "Fajr", t: p.fajr },
    { key: "sunrise", name: "Sunrise", t: p.sunrise, arrow: "up" },
    { key: "dhuhr", name: "Dhuhr", t: p.dhuhr },
    { key: "asr", name: "Asr", t: asrT },
    { key: "maghrib", name: "Maghrib", t: maghrib, arrow: "down" },
    { key: "isha", name: "Isha", t: isha },
  ];
  const d = nowDate();
  return {
    region, method, school, entries, next, tomorrow, now, until,
    sunriseT: p.sunrise, sunsetT: p.sunset, maghribT: maghrib,
    cardPrayerName, cardLabel, cardPill, milestones,
    countdownShort: exactNowPrayer ? `Now: ${exactNowPrayer.name}`
      : until < 60 ? `${until}m to ${next.name}`
      : (until % 60 === 0 ? `${Math.floor(until / 60)}h to ${next.name}` : `${Math.floor(until / 60)}h ${until % 60}m to ${next.name}`),
    countdownLong: until <= 0 ? "Starting now"
      : until < 60 ? `in ${until}m`
      : (until % 60 === 0 ? `in ${Math.floor(until / 60)}h` : `in ${Math.floor(until / 60)}h ${until % 60}m`),
    regionNow: `${d.toLocaleString("en-US", { weekday: "short" })}, ${d.toLocaleString("en-US", { month: "short" })} ${d.getDate()} • ${hhmm(now)}`,
  };
}

function netLiveStats() {
  const samples = state.netLive.samples;
  const cur = samples[samples.length - 1] || { down: 0, up: 0 };
  let peakDown = 0, peakUp = 0, sumDown = 0, sumUp = 0;
  for (const s of samples) {
    if (s.down > peakDown) peakDown = s.down;
    if (s.up > peakUp) peakUp = s.up;
    sumDown += s.down;
    sumUp += s.up;
  }
  const n = Math.max(1, samples.length);
  return {
    samples, cur, peakDown, peakUp,
    avgDown: Math.round(sumDown / n),
    avgUp: Math.round(sumUp / n),
    noTraffic: state.scenario === "notraffic" || (peakDown === 0 && peakUp === 0),
  };
}

  let tightest = null;
  for (const p of providers) {
    if (p.linkOnly || !p.signedIn) continue;
    for (const w of [
      { provider: p, win: "5h", pct: p.shortPct, reset: p.shortReset },
      { provider: p, win: "Wk", pct: p.weekPct, reset: p.weekReset },
    ]) {
      if (!tightest || w.pct < tightest.pct) tightest = w;
    }
  }
  const now = new Date(nowDate().getTime() + state.ai.refreshOffsetSec * 1000);
  return {
    providers,
    tightest,
    updatedAt: `${pad2(now.getHours())}:${pad2(now.getMinutes())}:${pad2(now.getSeconds())}`,
  };
}

const AI_DOCK_AUTO_LABEL = "Tightest limit (auto)";
function resolveAiDock(ai) {
  const mode = state.aiDock || "auto";
  if (mode === "auto") {
    const band = !ai.tightest
      ? { icon: "\uE99A", title: "AI Usage", subtitle: "No data" }
      : {
          icon: logo(ai.tightest.provider.id),
          title: `${ai.tightest.provider.name} ${ai.tightest.pct}%`,
          subtitle: `${ai.tightest.win} • resets ${ai.tightest.reset}`,
        };
    return { mode: "auto", choiceLabel: AI_DOCK_AUTO_LABEL, provider: ai.tightest ? ai.tightest.provider : null, band };
  }
  const p = ai.providers.find(x => x.id === mode && !x.linkOnly);
  if (!p) {
    state.aiDock = "auto";
    return resolveAiDock(ai);
  }
  if (!p.signedIn) {
    return {
      mode: p.id,
      choiceLabel: p.name,
      provider: p,
      band: { icon: logo(p.id), title: p.name, subtitle: "No data" },
    };
  }
  const w = p.weekPct < p.shortPct
    ? { win: "Wk", pct: p.weekPct, reset: p.weekReset }
    : { win: "5h", pct: p.shortPct, reset: p.shortReset };
  return {
    mode: p.id,
    choiceLabel: p.name,
    provider: p,
    band: { icon: logo(p.id), title: `${p.name} ${w.pct}%`, subtitle: `${w.win} • resets ${w.reset}` },
  };
}

const formatMmSs = sec => `${pad2(Math.floor(Math.max(0, sec) / 60))}:${pad2(Math.max(0, sec) % 60)}`;
function pomoPhaseSubtitle(p) {
  if (p.phase === "focus") return `Focus ${p.sessionIndex}/${p.sessionsPerCycle}`;
  if (p.phase === "short") return "Short break";
  return "Long break";
}
function pomoDurationSec(p, phase) {
  if (phase === "focus") return p.focusMin * 60;
  if (phase === "short") return p.shortBreakMin * 60;
  return p.longBreakMin * 60;
}
function pomoToggle() {
  const p = state.pomodoro;
  if (p.remainingSec <= 0) {
    p.totalSec = pomoDurationSec(p, p.phase);
    p.remainingSec = p.totalSec;
  }
  p.running = !p.running;
}
function pomoAddMinute() {
  const p = state.pomodoro;
  p.remainingSec += 60;
  p.totalSec = Math.max(p.totalSec, p.remainingSec);
  toast("Added +1 min");
}
function pomoReset() {
  const p = state.pomodoro;
  p.running = false;
  p.totalSec = pomoDurationSec(p, p.phase);
  p.remainingSec = p.totalSec;
}
function pomoAdvance(completedByTimer) {
  const p = state.pomodoro;
  if (p.phase === "focus") {
    if (completedByTimer) {
      p.todaySessions += 1;
      p.weekDays[p.weekDays.length - 1].sessions += 1;
    }
    p.phase = p.sessionIndex >= p.sessionsPerCycle ? "long" : "short";
  } else if (p.phase === "short") {
    p.sessionIndex = Math.min(p.sessionsPerCycle, p.sessionIndex + 1);
    p.phase = "focus";
  } else {
    p.sessionIndex = 1;
    p.phase = "focus";
  }
  p.totalSec = pomoDurationSec(p, p.phase);
  p.remainingSec = p.totalSec;
  p.running = false;
  if (completedByTimer && p.notify) {
    showWinNotifCustom("\uE916", "Pomodoro — Phase Complete", `Up next: ${pomoPhaseSubtitle(p)} (${formatMmSs(p.totalSec)})`);
  }
}

  calendar() {
    const today = nowDate();
    const lead = (today.getDay() + 6) % 7; // Monday-first week in the preview
    const weekStart = new Date(today.getFullYear(), today.getMonth(), today.getDate() - lead + state.calendarOffset * 7);
    const mid = new Date(weekStart.getFullYear(), weekStart.getMonth(), weekStart.getDate() + 3);
    const isCurrent = state.calendarOffset === 0;
    const left = daysInYear(today.getFullYear()) - dayOfYear(today);
    const move = delta => { state.calendarOffset = delta === 0 ? 0 : state.calendarOffset + delta; };
    return {
      kind: "content",
      name: "Calendar",
      title: `Calendar  •  ${monthNamesFor(state.calendar.main)[datePartsIn(state.calendar.main, mid).month - 1]} ${datePartsIn(state.calendar.main, mid).year}`,
      icon: "\uE787",
      commands: [
        { icon: "\uE76B", name: "Previous Week", run: () => move(-1) },
        { icon: "\uE8D1", name: "Go to Today", run: () => move(0) },
        { icon: "\uE76C", name: "Next Week", run: () => move(1) },
        ...calendarMore(today),
      ],
      content: [
        { cal: { weekStart, mid, today } },
        {
          form: {
            compact: true,
            align: "start",
            actions: [
              { id: "prev", icon: "\uE76B", label: "Previous" },
              { id: "today", icon: "\uE8D1", label: "Today", primary: isCurrent },
              { id: "next", icon: "\uE76C", label: "Next" },
              { id: "settings", icon: "\uE713", label: "Settings" },
            ],
            onAction(actionId) {
              if (actionId === "prev") move(-1);
              else if (actionId === "next") move(1);
              else if (actionId === "today") move(0);
              else if (actionId === "settings") { openPage("calendarSettings", false); return; }
              render();
            },
          },
        },
        {
          md: `**${longDate(today)}**  \n${formatPersian(today)}  •  ${formatQamari(today)}  \nWeek ${isoWeek(today)}  •  Day ${dayOfYear(today)} of ${daysInYear(today.getFullYear())}  •  ${left} days left this year`,
        },
      ],
    };
  },

    const ai = buildAiUsage();
    const dock = resolveAiDock(ai);
    const win = state.aiWindow || "5h";
    const winLabel = win === "week" ? "Weekly" : "5h";
    const charts = {
      "ai-compare": { kind: "aiCompare", ai, win, dark: true, w: 300, h: 175 },
    };
    const dockDetailBody = dock.mode === "auto"
      ? `**Mode:** ${AI_DOCK_AUTO_LABEL}  \n**Showing:** ${dock.band.title}  •  ${dock.band.subtitle}\n\nAutomatically tracks whichever signed-in provider and window (5-hour or weekly) is closest to its limit.\n\nPress **Enter** to pin a specific provider to the Dock.`
      : `**Mode:** ${dock.choiceLabel} (pinned)  \n**Showing:** ${dock.band.title}  •  ${dock.band.subtitle}\n\nAlways displays **${dock.choiceLabel}** on the Dock band using its tightest window (5-hour or weekly).\n\nPress **Enter** to choose another provider or switch back to auto.`;
    const items = [
      {
        icon: "\uE9E9",
        title: "Compare Providers",
        subtitle: `${winLabel} remaining for Claude, Antigravity and Codex side by side`,
        tags: [{ text: "Live", tone: "accent" }],
        details: {
          title: "Compare Providers",
          body: "![Compare Providers](chart:ai-compare)\n\n_Redraws when new usage arrives_",
        },
        cmd: { name: "AI Usage Dashboard", ...go("aiDashboard") },
        more: [
          { icon: "\uE72C", name: "Refresh AI Usage", run: refreshAiUsage },
        ],
      },
      {
        icon: "\uE718",
        title: `Dock Shows: ${dock.choiceLabel}`,
        subtitle: "Choose which AI provider appears on the Dock",
        tags: [{ text: "Dock", tone: "accent" }],
        details: {
          title: "Dock Display",
          body: dockDetailBody,
        },
        cmd: { name: "Dock Provider", ...go("aiDockPicker") },
        more: [
          { icon: "\uE72C", name: "Refresh AI Usage", run: refreshAiUsage },
        ],
      },
    ];
    for (const p of ai.providers) {
      if (p.linkOnly) {
        items.push({
          icon: logo(p.id),
          title: p.name,
          subtitle: "Usage is shown on cursor.com  •  press Enter to open",
          tags: [{ text: "Link", tone: "" }],
          details: {
            title: p.name,
            body: `**Source:** ${p.plan}\n\n${p.name} doesn't offer a local way to read plan usage, so DockPulse doesn't show numbers for it and never reads your ${p.name} sign-in.\n\nPress **Enter** to open your usage page in the browser.`,
          },
          cmd: { icon: "\uE774", ...uri(`Open ${p.name} Usage`, p.url) },
          more: [
            { icon: "\uE774", ...uri(`Open ${p.name} Usage`, p.url) },
            { icon: "\uE72C", name: "Refresh All AI Usage", run: refreshAiUsage },
          ],
        });
        continue;
      }
      const key = "ai-" + p.id;
      charts[key] = { kind: "aiBars", provider: p, dark: true, w: 300, h: 175 };
      const isPinned = state.aiDock === p.id;
      const showOnDockCmd = {
        icon: "\uE718",
        name: isPinned ? "Showing on Dock" : "Show on Dock",
        run: () => {
          if (!isPinned) state.aiDock = p.id;
          toast(`Dock now shows ${p.name}`);
        },
      };
      if (!p.signedIn) {
        const sub = p.unavailableSub || "No usage data available";
        items.push({
          icon: logo(p.id),
          title: p.name,
          subtitle: sub,
          tags: [{ text: "No data", tone: "warn" }],
          details: {
            title: p.name,
            body: `![${p.name} Usage](chart:${key})\n\n**Status:** ${sub}  \n**Source:** ${p.plan}`,
          },
          cmd: refresh(`Refresh ${p.name}`),
          more: [
            showOnDockCmd,
            { icon: "\uE72C", name: "Refresh All AI Usage", run: refreshAiUsage },
            { icon: "\uE774", ...uri(`Open ${p.name} Settings`, p.url) },
          ],
        });
        continue;
      }
      const limitHit = p.shortPct === 0 || p.weekPct === 0;
      const age = p.age || "updated 3 min ago";
      items.push({
        icon: logo(p.id),
        title: p.name,
        subtitle: limitHit
          ? `Limit reached  •  5h resets in ${p.shortReset}  •  Weekly resets in ${p.weekReset}  •  ${age}`
          : `5h resets in ${p.shortReset}  •  Weekly resets in ${p.weekReset}  •  ${age}`,
        tags: [
          { text: `5h ${p.shortPct}%`, tone: pctTone(p.shortPct) },
          { text: `Weekly ${p.weekPct}%`, tone: pctTone(p.weekPct) },
        ],
        details: {
          title: p.name,
          body: `![${p.name} Usage](chart:${key})\n\n**Source:** ${p.plan}  \n**5-Hour Window:** ${p.shortPct}% remaining (resets in ${p.shortReset})  \n**Weekly Limit:** ${p.weekPct}% remaining (resets in ${p.weekReset})  \n_${age}_`,
        },
        cmd: refresh(`Refresh ${p.name}`),
        more: [
          showOnDockCmd,
          { icon: "\uE72C", name: "Refresh All AI Usage", run: refreshAiUsage },
          { icon: "\uE774", ...uri(`Open ${p.name} Usage`, p.url) },
        ],
      });
    }
    items.push({
      icon: "\uE8C8",
      title: "Set up Claude usage",
      subtitle: "Copy status-line script & ~/.claude/settings.json snippet to clipboard",
      tags: [{ text: "Claude Code", tone: "accent" }],
      details: {
        title: "Set up Claude usage",
        body: "DockPulse reads Claude Code's local usage cache at `~/.claude/dockpulse-usage.json` and never edits `~/.claude/settings.json` or reads credentials.\n\n**1. Save the status-line script** to `C:/Users/<you>/.claude/dockpulse-statusline.ps1`.\n\n**2. Add `statusLine` to** `C:/Users/<you>/.claude/settings.json`.\n\nPress **Enter** on this row to copy both snippets to your clipboard.",
      },
      cmd: { name: "Copy Setup Snippet", run: () => toast("Copied Claude statusLine script & settings.json snippet") },
    });
    const firstTracked = ai.providers.find(p => !p.linkOnly) || ai.providers[0];
    const fallbackKey = ai.tightest ? `ai-${ai.tightest.provider.id}` : `ai-${firstTracked.id}`;
    const fallbackTitle = ai.tightest ? ai.tightest.provider.name : firstTracked.name;
    items.push({
      icon: "\uE72C",
      title: "Refresh AI Usage",
      subtitle: `Last checked at ${ai.updatedAt}`,
      details: {
        title: `${fallbackTitle} (Tightest Limit)`,
        body: `![AI Usage](chart:${fallbackKey})\n\nReads local usage snapshots for Claude (~/.claude/dockpulse-usage.json) and Codex (~/.codex/sessions). Strictly offline.`,
      },
      cmd: { name: "Refresh AI Usage", run: refreshAiUsage },
    });
    return { kind: "list", name: "AI Usage", title: "AI Usage Limits", icon: "\uE99A", placeholder: "Filter AI providers...", showDetails: true, charts, items };
  },

  aiDashboard() {
    const ai = buildAiUsage();
    const win = state.aiWindow || "5h";
    const isWeek = win === "week";
    const winLabel = isWeek ? "Weekly" : "5h";
    const lines = ai.providers.map(p => {
      if (p.linkOnly) return `**${p.name}:** usage on cursor.com (link only)`;
      if (!p.signedIn) return `**${p.name}:** ${p.unavailableSub || "No data"}  •  ${p.plan}`;
      const pct = isWeek ? p.weekPct : p.shortPct;
      const reset = isWeek ? p.weekReset : p.shortReset;
      return `**${p.name}:** ${pct}% remaining (resets in ${reset})  •  ${p.plan}`;
    });
    lines.push(`_Last checked at ${ai.updatedAt}_`);

    return {
      kind: "content",
      name: "AI Usage Dashboard",
      title: `AI Usage Dashboard  •  ${winLabel}`,
      icon: "\uE9E9",
      commands: [
        { icon: "\uE823", name: "Show 5-Hour Window", run: () => { state.aiWindow = "5h"; } },
        { icon: "\uE8C0", name: "Show Weekly Limit", run: () => { state.aiWindow = "week"; } },
        { icon: "\uE72C", name: "Refresh AI Usage", run: refreshAiUsage },
        { icon: "\uE774", ...uri("Open Cursor Usage", "https://cursor.com/dashboard?tab=usage") },
      ],
      content: [
        { chart: { kind: "aiCompare", ai, win, dark: true, w: 480, h: 245, center: true } },
        {
          form: {
            compact: true,
            actions: [
              { id: "5h", icon: "\uE823", label: "5h", primary: win === "5h" },
              { id: "week", icon: "\uE8C0", label: "Weekly", primary: win === "week" },
              { id: "refresh", icon: "\uE72C", label: "Refresh" },
            ],
            onAction(actionId) {
              if (actionId === "5h" || actionId === "week") {
                state.aiWindow = actionId;
                render();
              } else if (actionId === "refresh") {
                refreshAiUsage();
                render();
              }
            },
          },
        },
        { center: true, md: lines.join("  \n") },
      ],
    };
  },

    const t = state.today;

    const waterTags = t.water >= t.waterGoal
      ? [{ text: `${t.water}/${t.waterGoal}`, tone: "ok" }, { text: "Goal Met", tone: "ok" }]
      : [{ text: `${t.water}/${t.waterGoal}`, tone: "accent" }];
    const coffeeTags = t.coffeeDone
      ? [{ text: "Done", tone: "ok" }, hhmm(t.coffeeTime)]
      : due
        ? [{ text: "Coffee Time", tone: "warn" }, hhmm(t.coffeeTime)]
        : [hhmm(t.coffeeTime)];

    const items = [
      {
        section: "Daily Habits",
        icon: "\uEB42",
        title: "Water",
        subtitle: `${t.water} of ${t.waterGoal} glasses today • Enter to add 1`,
        tags: waterTags,
        cmd: {
          name: "+1 Glass",

**Current Cycle:** ${pomoPhaseSubtitle(p)}  •  Focus ${p.focusMin}m / Short ${p.shortBreakMin}m / Long ${p.longBreakMin}m`,

      kind: "content",
      name: "Pomodoro Settings",
      title: "Pomodoro Settings",
      icon: "\uE713",
      content: [{
        form: {
          title: "Timer Durations & Cycle",
          desc: "Changes apply immediately to upcoming phases (and to the current timer when paused at full duration).",
          fields: [
            { row: [
              { id: "focusMin", type: "number", label: "Focus (minutes)", value: p.focusMin, min: 1, max: 120 },
              { id: "shortBreakMin", type: "number", label: "Short break (minutes)", value: p.shortBreakMin, min: 1, max: 60 },
            ] },
            { row: [
              { id: "longBreakMin", type: "number", label: "Long break (minutes)", value: p.longBreakMin, min: 1, max: 60 },
              { id: "sessionsPerCycle", type: "number", label: "Sessions before long break", value: p.sessionsPerCycle, min: 1, max: 8 },
            ] },
            { id: "notify", type: "toggle", label: "Send Windows notification when phase ends", value: p.notify },
          ],
          actions: [
            { id: "save", label: "Save Settings", primary: true, submit: true },
            { id: "cancel", label: "Cancel" },
          ],
          onAction(actionId, vals) {
            if (actionId === "cancel") { goBack(); return; }
            const focus = parseInt(vals.focusMin, 10);
            const sb = parseInt(vals.shortBreakMin, 10);
            const lb = parseInt(vals.longBreakMin, 10);
            const cyc = parseInt(vals.sessionsPerCycle, 10);
            if ([focus, sb, lb, cyc].some(n => !Number.isFinite(n) || n < 1)) {
              return "All durations and cycle count must be 1 or greater.";
            }
            const atFull = !p.running && p.remainingSec === p.totalSec;
            p.focusMin = focus;
            p.shortBreakMin = sb;
            p.longBreakMin = lb;
            p.sessionsPerCycle = Math.min(8, cyc);
            p.sessionIndex = Math.min(p.sessionIndex, p.sessionsPerCycle);
            p.notify = Boolean(vals.notify);
            if (atFull) {
              p.totalSec = pomoDurationSec(p, p.phase);
              p.remainingSec = p.totalSec;
            }
            goBack();
            toast(`Saved: ${p.focusMin}/${p.shortBreakMin}/${p.longBreakMin}m (${p.sessionsPerCycle}×)`);
          },
        },
      }],
    };
  },
};

/* Working Folder band (DockBands/WorkingFolderDockBandItem.cs): one click opens the folder in File Explorer */
const wfExists = () => state.scenario !== "folder_missing";
function wfName(path) {
  const trimmed = path.replace(/[\\/]+$/, "");
  const i = trimmed.lastIndexOf("\\");
  return i < 0 || /^[A-Za-z]:$/.test(trimmed) ? path : trimmed.slice(i + 1);
}
function wfParent(path) {
  const trimmed = path.replace(/[\\/]+$/, "");
  if (/^[A-Za-z]:$/.test(trimmed)) return "Drive";
  const i = trimmed.lastIndexOf("\\");
  const parent = trimmed.slice(0, i);
  return /^[A-Za-z]:$/.test(parent) ? parent + "\\" : parent;
}
function wfOpenExplorer() {
  if (!wfExists()) { toast(`Folder not found: ${state.workFolder.path}`); return; }
  toast(`Would open ${state.workFolder.path} in File Explorer`);
}
function wfBand() {
  const path = state.workFolder.path;
  const more = [
    { icon: "\uE943", name: "Open in VS Code", run: () => toast(`Would open ${path} in VS Code`) },
    { icon: "\uE756", name: "Open in Terminal", run: () => toast(`Would open a terminal in ${path}`) },
    { icon: "\uE8C8", name: "Copy Path", run: () => toast(`Copied ${path}`) },
    { icon: "\uE70F", name: "Change Folder...", ...go("workFolderSettings") },
  ];
  return wfExists()
    ? { label: "Working Folder", run: wfOpenExplorer, icon: "\uE8B7", title: wfName(path), subtitle: wfParent(path), more }
    : { label: "Working Folder", page: "workFolderSettings", icon: "\uE7BA", title: "Folder missing", subtitle: path, more };
}

function shouldDrawXLabel(i, count) {
  if (count <= 12) return true;
  if (count === 24) return [0, 4, 8, 12, 16, 20, 23].includes(i);
  const day = i + 1;
  return day === 1 || day === count || (day % 5 === 0 && (count - day) >= 2);
}

function drawChart(cv, spec) {
  const w = spec.w || 600, h = spec.h || 260, P = spec.dark ? PALETTES.dark : PALETTES.light;
  const dpr = Math.max(1, window.devicePixelRatio || 1);
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  sizeChartCanvas(cv, w);
  const c = cv.getContext("2d");
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  c.textBaseline = "top";
  const box = (x, y, bw, bh, r, color) => { c.beginPath(); c.roundRect(x, y, bw, bh, r); c.fillStyle = rgb(color); c.fill(); };

  c.beginPath(); c.roundRect(0.5, 0.5, w - 1, h - 1, 12);
  c.fillStyle = rgb(P.cardBg); c.fill(); c.strokeStyle = rgb(P.cardBorder); c.lineWidth = 1; c.stroke();

  let totalDown = 0, totalUp = 0, maxBucket = 0;
  for (const b of spec.buckets) { totalDown += b.rx; totalUp += b.tx; maxBucket = Math.max(maxBucket, b.rx + b.tx); }

  const padL = 18, padR = 18;
  const upperTitle = spec.title.toUpperCase();
  const upText = `UP ${formatBytes(totalUp)}`, downText = `DOWN ${formatBytes(totalDown)}`;
  c.font = FONT1;
  const upW = c.measureText(upText).width, downW = c.measureText(downText).width;
  const sw = 8, swGap = 5, lgGap = 12;
  const upX = w - padR - upW, upSwX = upX - swGap - sw, downX = upSwX - lgGap - downW, downSwX = downX - swGap - sw;
  c.font = FONT2;
  const big = padL + c.measureText(upperTitle).width + 12 <= downSwX;
  c.font = big ? FONT2 : FONT1; c.fillStyle = rgb(P.text1);
  c.fillText(upperTitle, padL, big ? 14 : 16);
  if (spec.subtitle) { c.font = FONT1; c.fillStyle = rgb(P.text2); c.fillText(spec.subtitle, padL, big ? 34 : 30); }

  // Same rule as NetworkChartRenderer (6 px per character): if the small title still runs into the legend,
  // the legend moves to its own row under the subtitle
  const px = s => s.length * 6 - 1;
  const downSwPx = w - padR - px(upText) - swGap - sw - lgGap - px(downText) - swGap - sw;
  const legendY = !big && padL + px(upperTitle) + 12 > downSwPx ? 44 : 16;

  c.font = FONT1;
  box(downSwX, legendY + 1, sw, sw, 2, P.down); c.fillStyle = rgb(P.text1); c.fillText(downText, downX, legendY);
  box(upSwX, legendY + 1, sw, sw, 2, P.up); c.fillStyle = rgb(P.text1); c.fillText(upText, upX, legendY);

  const plotL = 68, plotR = w - padR, plotT = 58, plotB = h - 34;
  const plotW = Math.max(40, plotR - plotL), plotH = Math.max(40, plotB - plotT);
  const yMax = niceCeiling(maxBucket), yMid = Math.floor(yMax / 2);

  c.strokeStyle = rgb(P.grid); c.setLineDash([3, 3]);
  for (const y of [plotT, plotT + Math.floor(plotH / 2)]) { c.beginPath(); c.moveTo(plotL, y + 0.5); c.lineTo(plotR, y + 0.5); c.stroke(); }
  c.setLineDash([]); c.strokeStyle = rgb(P.axis);
  c.beginPath(); c.moveTo(plotL, plotB + 0.5); c.lineTo(plotR, plotB + 0.5); c.stroke();

  c.fillStyle = rgb(P.text2); c.textAlign = "right";
  c.fillText(formatShortAxis(yMax), plotL - 8, plotT - 4);
  c.fillText(formatShortAxis(yMid), plotL - 8, plotT + Math.floor(plotH / 2) - 4);
  c.fillText("0", plotL - 8, plotB - 4);
  c.textAlign = "left";

  const count = spec.buckets.length;
  if (count === 0) return;
  const slot = plotW / count;
  const barW = Math.min(22, Math.max(3, Math.floor(slot * 0.66)));
  for (let i = 0; i < count; i++) {
    const cx = plotL + Math.round((i + 0.5) * slot), left = cx - Math.floor(barW / 2);
    const active = i === spec.active, future = spec.active >= 0 && i > spec.active;
    box(left, plotT + 2, barW, plotH - 2, 2, future ? P.trackFuture : P.trackElapsed);

    const b = spec.buckets[i], total = b.rx + b.tx;
    if (total > 0 && yMax > 0) {
      let totalPx = Math.round(total / yMax * (plotH - 2));
      totalPx = Math.min(plotH - 2, Math.max(3, totalPx));
      let downPx = b.rx > 0 ? Math.round(b.rx / total * totalPx) : 0, upPx = totalPx - downPx;
      if (b.rx > 0 && downPx === 0 && totalPx >= 2) { downPx = 1; upPx = totalPx - 1; }
      if (b.tx > 0 && upPx === 0 && totalPx >= 2) { upPx = 1; downPx = totalPx - 1; }
      const top = plotB - totalPx, dc = active ? P.downHi : P.down, uc = active ? P.upHi : P.up;
      const topRounded = (y, hh, col) => { c.beginPath(); c.roundRect(left, y, barW, hh, [2, 2, 0, 0]); c.fillStyle = rgb(col); c.fill(); };
      if (upPx > 0 && downPx > 0) { c.fillStyle = rgb(dc); c.fillRect(left, plotB - downPx, barW, downPx); topRounded(top, upPx, uc); }
      else if (downPx > 0) topRounded(top, downPx, dc);
      else if (upPx > 0) topRounded(top, upPx, uc);
    }
    if (active) { c.fillStyle = rgb(P.marker); c.fillRect(cx - Math.max(2, Math.floor(barW / 3)), plotB + 4, Math.max(4, Math.floor(barW * 2 / 3)), 2); }
      if (shouldDrawXLabel(i, count)) {
      const lbl = b.label, lw = c.measureText(lbl).width;
      const lx = Math.min(plotR - lw, Math.max(plotL, cx - lw / 2));
      c.fillStyle = rgb(active ? P.text1 : P.text2);
      c.fillText(lbl, lx, plotB + 10);
    }
  }
}

// The C# chart renderers use an uppercase-only 5x7 pixel font; mirror that on the new charts' canvases.
function upperCaseCanvasText(c) {
  if (c.__upperText) return;
  const fill = c.fillText.bind(c), measure = c.measureText.bind(c);
  c.fillText = (t, ...rest) => fill(String(t).toUpperCase(), ...rest);
  c.measureText = t => measure(String(t).toUpperCase());
  c.__upperText = true;
}

/* =====================================================================
   Live network speed line/area chart (same dark palette & rules as drawChart)
   ===================================================================== */
function drawNetLiveChart(cv, spec) {
  const w = spec.w || 480, h = spec.h || 250;
  const P = spec.dark !== false ? PALETTES.dark : PALETTES.light;
  const dpr = Math.max(1, window.devicePixelRatio || 1);
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  sizeChartCanvas(cv, w);
  const c = cv.getContext("2d");
  upperCaseCanvasText(c);
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  c.textBaseline = "top";
  const box = (x, y, bw, bh, r, color) => { c.beginPath(); c.roundRect(x, y, bw, bh, r); c.fillStyle = rgb(color); c.fill(); };

  c.beginPath(); c.roundRect(0.5, 0.5, w - 1, h - 1, 12);
  c.fillStyle = rgb(P.cardBg); c.fill(); c.strokeStyle = rgb(P.cardBorder); c.lineWidth = 1; c.stroke();

  const live = netLiveStats();
  const padL = 18, padR = 18;
  const upperTitle = "LIVE SPEED";
  const subtitle = `↓ ${formatBps(live.cur.down)}  |  ↑ ${formatBps(live.cur.up)}  |  PEAK ↓ ${formatBps(live.peakDown)}`;
  const upText = "UP", downText = "DOWN";

  c.font = FONT1;
  const upW = c.measureText(upText).width, downW = c.measureText(downText).width;
  const sw = 8, swGap = 5, lgGap = 12;
  const upX = w - padR - upW, upSwX = upX - swGap - sw, downX = upSwX - lgGap - downW, downSwX = downX - swGap - sw;
  c.font = FONT2;
  const big = padL + c.measureText(upperTitle).width + 12 <= downSwX;
  c.font = big ? FONT2 : FONT1; c.fillStyle = rgb(P.text1); c.textAlign = "left";
  c.fillText(upperTitle, padL, big ? 14 : 16);

  c.font = FONT1; c.fillStyle = rgb(P.text2);
  c.fillText(subtitle, padL, big ? 34 : 30);

  // Same 6 px/char layout rule as NetworkChartRenderer
  const px = s => s.length * 6 - 1;
  const downSwPx = w - padR - px(upText) - swGap - sw - lgGap - px(downText) - swGap - sw;
  const legendY = !big && padL + px(upperTitle) + 12 > downSwPx ? 44 : 16;

  c.font = FONT1;
  box(downSwX, legendY + 1, sw, sw, 2, P.down); c.fillStyle = rgb(P.text1); c.fillText(downText, downX, legendY);
  box(upSwX, legendY + 1, sw, sw, 2, P.up); c.fillStyle = rgb(P.text1); c.fillText(upText, upX, legendY);

  const plotL = 68, plotR = w - padR, plotT = 58, plotB = h - 34;
  const plotW = Math.max(40, plotR - plotL), plotH = Math.max(40, plotB - plotT);
  const maxVal = Math.max(live.peakDown, live.peakUp);
  const yMax = niceBpsCeiling(maxVal), yMid = Math.floor(yMax / 2);

  c.strokeStyle = rgb(P.grid); c.lineWidth = 1; c.setLineDash([3, 3]);
  for (const y of [plotT, plotT + Math.floor(plotH / 2)]) {
    c.beginPath(); c.moveTo(plotL, y + 0.5); c.lineTo(plotR, y + 0.5); c.stroke();
  }
  c.setLineDash([]); c.strokeStyle = rgb(P.axis);
  c.beginPath(); c.moveTo(plotL, plotB + 0.5); c.lineTo(plotR, plotB + 0.5); c.stroke();

  c.font = FONT1; c.fillStyle = rgb(P.text2); c.textAlign = "right";
  c.fillText(formatShortBpsAxis(yMax), plotL - 8, plotT - 4);
  c.fillText(formatShortBpsAxis(yMid), plotL - 8, plotT + Math.floor(plotH / 2) - 4);
  c.fillText("0", plotL - 8, plotB - 4);
  c.textAlign = "left";

  const samples = live.samples, n = samples.length;
  if (n > 1) {
    const xAt = i => plotL + (i / (n - 1)) * plotW;
    const yAt = v => plotB - Math.max(0, Math.min(1, v / yMax)) * (plotH - 2);

    if (live.noTraffic) {
      c.strokeStyle = rgb(P.down); c.lineWidth = 1.8;
      c.beginPath(); c.moveTo(plotL, plotB - 1); c.lineTo(plotR, plotB - 1); c.stroke();

      const msg = "No traffic in the last 60 s";
      c.font = FONT1;
      const mw = c.measureText(msg).width;
      const mx = plotL + plotW / 2, my = plotT + Math.floor(plotH / 2) - 5;
      box(mx - mw / 2 - 6, my - 3, mw + 12, 15, 4, P.cardBg);
      c.fillStyle = rgb(P.text2); c.textAlign = "center";
      c.fillText(msg, mx, my);
      c.textAlign = "left";
    } else {
      const drawSeries = (key, col, fillRgba, lineW) => {
        c.beginPath();
        c.moveTo(xAt(0), plotB);
        for (let i = 0; i < n; i++) c.lineTo(xAt(i), yAt(samples[i][key]));
        c.lineTo(xAt(n - 1), plotB);
        c.closePath();
        c.fillStyle = fillRgba;
        c.fill();

        c.beginPath();
        for (let i = 0; i < n; i++) {
          const x = xAt(i), y = yAt(samples[i][key]);
          if (i === 0) c.moveTo(x, y); else c.lineTo(x, y);
        }
        c.strokeStyle = rgb(col);
        c.lineWidth = lineW;
        c.lineJoin = "round";
        c.lineCap = "round";
        c.stroke();

        const lx = xAt(n - 1), ly = yAt(samples[n - 1][key]);
        c.beginPath(); c.arc(lx, ly, 3, 0, Math.PI * 2);
        c.fillStyle = rgb(col); c.fill();
      };
      drawSeries("down", P.down, "rgba(56, 189, 248, 0.16)", 2);
      drawSeries("up", P.up, "rgba(167, 139, 250, 0.16)", 1.6);
    }
  }

  const xTicks = [
    { frac: 0, lbl: "60s", active: false },
    { frac: 0.25, lbl: "45s", active: false },
    { frac: 0.5, lbl: "30s", active: false },
    { frac: 0.75, lbl: "15s", active: false },
    { frac: 1, lbl: "now", active: true },
  ];
  c.font = FONT1;
  for (const t of xTicks) {
    const cx = plotL + t.frac * plotW;
    const lw = c.measureText(t.lbl).width;
    const lx = Math.min(plotR - lw, Math.max(plotL, cx - lw / 2));
    c.fillStyle = rgb(t.active ? P.text1 : P.text2);
    c.fillText(t.lbl, lx, plotB + 10);
  }
}

/* =====================================================================
   Prayer Schedule Card renderer: radial bar dial matching NetworkChartRenderer
   ===================================================================== */
function drawPrayerScheduleCard(cv, p) {
  const w = 820, h = 218;
  const P = PALETTES.dark; // Matches NetworkUsagePage chart palette (#1C2028 + cyan #38BDF8 + violet #A78BFA)
  const dpr = Math.max(1, window.devicePixelRatio || 1);
  cv.width = Math.round(w * dpr);
  cv.height = Math.round(h * dpr);
  const c = cv.getContext("2d");
  c.setTransform(dpr, 0, 0, dpr, 0, 0);

  const box = (x, y, bw, bh, r, col) => { c.beginPath(); c.roundRect(x, y, bw, bh, r); c.fillStyle = col; c.fill(); };
  const GRAY_BAR = "rgb(75, 85, 101)";
  const GRAY_PTR = "rgb(100, 116, 139)";
  const GRAY_TXT = "rgb(118, 131, 150)";

  c.save();
  // 1. Card surface & border (identical to NetworkChartRenderer)
  c.beginPath();
  c.roundRect(0.5, 0.5, w - 1, h - 1, 12);
  c.fillStyle = rgb(P.cardBg);
  c.fill();
  c.strokeStyle = rgb(P.cardBorder);
  c.lineWidth = 1;
  c.stroke();

  // 2. Top header row + legend swatches (mirrors NetworkChartRenderer header)
  const padL = 18, padR = 18;
  c.textBaseline = "top";
  c.textAlign = "left";
  c.font = FONT2;
  c.fillStyle = rgb(P.text1);
  c.fillText("PRAYER SCHEDULE", padL, 14);

  c.font = FONT1;
  c.fillStyle = rgb(P.text2);
  c.fillText(`${p.region.display.toUpperCase()}` + `  |  ${p.region.tz}  |  LOCAL ${hhmm(p.now)}`, padL, 34);

  // Top-right legend swatches: PASSED (gray), NEXT (cyan), UPCOMING (violet)
  const legends = [
    { col: GRAY_PTR, text: "PASSED" },
    { col: rgb(P.down), text: "COUNTDOWN" },
    { col: rgb(P.up), text: "UPCOMING" },
  ];
  c.font = FONT1;
  const sw = 8, swGap = 5, lgGap = 12;
  let lx = w - padR;
  for (let i = legends.length - 1; i >= 0; i--) {
    const tw = c.measureText(legends[i].text).width;
    lx -= tw;
    c.fillStyle = rgb(P.text1);
    c.fillText(legends[i].text, lx, 16);
    lx -= (swGap + sw);
    box(lx, 17, sw, sw, 2, legends[i].col);
    lx -= lgGap;
  }

  // Subtle background grid lines + horizon baseline
  const cx = w / 2, baseY = 198;
  c.strokeStyle = rgb(P.grid);
  c.lineWidth = 1;
  c.setLineDash([3, 3]);
  for (const gy of [96, 148]) {
    c.beginPath(); c.moveTo(padL, gy + 0.5); c.lineTo(w - padR, gy + 0.5); c.stroke();
  }
  c.setLineDash([]);
  c.strokeStyle = rgb(P.axis);
  c.beginPath(); c.moveTo(padL, baseY + 0.5); c.lineTo(w - padR, baseY + 0.5); c.stroke();

  // 3. Semicircular radial bar dial (61 bars spaced every 3 degrees from 180° to 0°)
  const totalBars = 60; // indices 0..60 -> 61 radial bars
  const milestoneIndices = [3, 13, 24, 36, 47, 57]; // Fajr, Sunrise, Dhuhr, Asr, Maghrib, Isha
  const anchors = [
    { k: 0, t: 0 },
    ...p.milestones.map((m, idx) => ({ k: milestoneIndices[idx], t: m.t })),
    { k: totalBars, t: 1440 },
  ];

  // Piecewise-linear map of current clock time -> bar position nowK
  let nowK = 0;
  for (let i = 0; i < anchors.length - 1; i++) {
    const a0 = anchors[i], a1 = anchors[i + 1];
    if (p.now >= a0.t && p.now <= a1.t) {
      const span = Math.max(1, a1.t - a0.t);
      nowK = a0.k + ((p.now - a0.t) / span) * (a1.k - a0.k);
      break;
    }
  }
  const targetMilestoneIdx = p.milestones.findIndex(m => m.name === p.cardPrayerName);
  const targetK = targetMilestoneIdx >= 0 ? milestoneIndices[targetMilestoneIdx] : -1;

  const rIn = 108, rOut = 122, rPtrIn = 103, rPtrOut = 136;

  // Ambient cyan/violet glow inside the active semicircle
  const innerGlow = c.createRadialGradient(cx, baseY - 36, 10, cx, baseY - 20, rOut);
  innerGlow.addColorStop(0, "rgba(56, 189, 248, 0.08)");
  innerGlow.addColorStop(1, "rgba(28, 32, 40, 0)");
  c.fillStyle = innerGlow;
  c.beginPath();
  c.arc(cx, baseY, rOut, Math.PI, Math.PI * 2, false);
  c.closePath();
  c.fill();

  // Draw all 61 radial bars around the semicircle
  c.lineCap = "round";
  for (let k = 0; k <= totalBars; k++) {
    const degAngle = 180 - k * 3;
    const rad = (degAngle * Math.PI) / 180;
    const cos = Math.cos(rad), sin = Math.sin(rad);

    const mIdx = milestoneIndices.indexOf(k);
    const isPointer = mIdx !== -1;
    const isTargetPtr = isPointer && mIdx === targetMilestoneIdx;
    const isPassed = p.tomorrow ? !isTargetPtr : (k <= nowK && !(isTargetPtr && p.cardLabel === "Prayer Time"));
    const isCountdownWindow = !p.tomorrow && k > nowK && targetK >= 0 && k <= targetK;

    const inner = isPointer ? rPtrIn : rIn;
    const outer = isPointer ? (isTargetPtr ? rPtrOut + 3 : rPtrOut) : rOut;

    let strokeCol;
    if (isTargetPtr) {
      strokeCol = rgb(P.downHi);
    } else if (isPassed) {
      strokeCol = isPointer ? GRAY_PTR : GRAY_BAR;
    } else if (isCountdownWindow) {
      strokeCol = rgb(P.down);
    } else {
      strokeCol = isPointer ? rgb(P.upHi) : "rgba(167, 139, 250, 0.45)";
    }

    // Subtle glow on the target prayer pointer bar
    if (isTargetPtr) {
      c.save();
      c.strokeStyle = "rgba(56, 189, 248, 0.32)";
      c.lineWidth = 8;
      c.beginPath();
      c.moveTo(cx + cos * inner, baseY - sin * inner);
      c.lineTo(cx + cos * outer, baseY - sin * outer);
      c.stroke();
      c.restore();
    }

    c.strokeStyle = strokeCol;
    c.lineWidth = isPointer ? (isTargetPtr ? 4 : 3.2) : 2.4;
    c.beginPath();
    c.moveTo(cx + cos * inner, baseY - sin * inner);
    c.lineTo(cx + cos * outer, baseY - sin * outer);
    c.stroke();
  }

  // 4. Prayer name + time labels attached to each of the 6 pointer bars
  cv._tileBounds = [];
  p.milestones.forEach((m, idx) => {
    const k = milestoneIndices[idx];
    const degAngle = 180 - k * 3;
    const rad = (degAngle * Math.PI) / 180;
    const cos = Math.cos(rad), sin = Math.sin(rad);

    const isTarget = idx === targetMilestoneIdx;
    const isPassed = p.tomorrow ? !isTarget : (m.t <= p.now && !(isTarget && p.cardLabel === "Prayer Time"));
    const onLeft = degAngle > 90;

    const tipX = cx + cos * (rPtrOut + 7);
    const tipY = baseY - sin * (rPtrOut + 5);
    const arrow = m.arrow === "up" ? " ↑" : (m.arrow === "down" ? " ↓" : "");
    const labelText = `${m.name.toUpperCase()}${arrow}  ${hhmm(m.t)}`;

    c.font = isTarget
      ? '700 11px "Cascadia Mono", Consolas, "Courier New", monospace'
      : FONT1;
    const tw = c.measureText(labelText).width;
    const pillPadX = 8, pillH = 20;
    const boxX = onLeft ? (tipX - tw - pillPadX * 2) : tipX;
    const boxY = tipY - pillH / 2;

    cv._tileBounds.push({ x1: boxX / w, x2: (boxX + tw + pillPadX * 2) / w, y1: boxY / h, y2: (boxY + pillH) / h, name: m.name, t: m.t });

    if (isTarget) {
      c.beginPath();
      c.roundRect(boxX, boxY, tw + pillPadX * 2, pillH, 10);
      c.fillStyle = "rgba(56, 189, 248, 0.14)";
      c.fill();
      c.strokeStyle = "rgba(56, 189, 248, 0.55)";
      c.lineWidth = 1;
      c.stroke();
      c.fillStyle = rgb(P.downHi);
    } else if (isPassed) {
      c.fillStyle = GRAY_TXT;
    } else {
      c.fillStyle = rgb(P.text1);
    }

    c.textAlign = "left";
    c.textBaseline = "middle";
    c.fillText(labelText, boxX + pillPadX, boxY + pillH / 2 + 0.5);
  });

  // 5. Center hero countdown inside the barred semicircle
  c.textAlign = "center";
  c.textBaseline = "middle";
  c.font = '700 25px "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif';
  c.fillStyle = rgb(P.text1);
  c.fillText(p.cardPrayerName, cx, baseY - 76);

  const pillText = p.cardLabel === "Prayer Time"
    ? `NOW  •  ${hhmm(p.now)}`
    : `TIME LEFT  •  ${Math.floor(p.until / 60)}H ${pad2(p.until % 60)}M`;
  c.font = FONT1;
  const pillW = Math.max(150, c.measureText(pillText).width + 24), pillH = 23;
  const pillX = cx - pillW / 2, pillY = baseY - 52;
  c.beginPath();
  c.roundRect(pillX, pillY, pillW, pillH, pillH / 2);
  c.fillStyle = "rgba(56, 189, 248, 0.12)";
  c.fill();
  c.strokeStyle = "rgba(56, 189, 248, 0.4)";
  c.lineWidth = 1;
  c.stroke();
  c.fillStyle = rgb(P.downHi);
  c.fillText(pillText, cx, pillY + pillH / 2 + 0.5);

  c.font = FONT1;
  c.fillStyle = rgb(P.text2);
  const nextSub = p.cardLabel === "Prayer Time"
    ? "PRAYER TIME REACHED"
    : `STARTS AT ${hhmm(p.next.t)}${p.tomorrow ? " (TOMORROW)" : ""}`;
  c.fillText(nextSub, cx, baseY - 15);

  c.restore();
}

/* =====================================================================
   AI Usage Limits card renderer (details pane PNG in C#)
   ===================================================================== */
// Command Palette scales ImageContent down to fit, but a Markdown image in a details pane is shown at
// its natural size and clipped, so details-pane charts are drawn full size here and the pane clips them.
function sizeChartCanvas(cv, w) {
  if (cv.closest && cv.closest(".details")) {
    cv.style.width = w + "px";
    cv.style.maxWidth = "none";
  } else {
    cv.style.maxWidth = w + "px";
  }
}

function drawAiUsageCard(cv, spec) {
  const w = spec.w || 300, h = spec.h || 175;
  const P = spec.dark ? PALETTES.dark : PALETTES.light;
  const p = spec.provider;
  const dpr = Math.max(1, window.devicePixelRatio || 1);
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  sizeChartCanvas(cv, w);
  const c = cv.getContext("2d");
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  c.textBaseline = "top";
  const box = (x, y, bw, bh, r, col) => { c.beginPath(); c.roundRect(x, y, bw, bh, r); c.fillStyle = col; c.fill(); };

  c.beginPath(); c.roundRect(0.5, 0.5, w - 1, h - 1, 12);
  c.fillStyle = rgb(P.cardBg); c.fill(); c.strokeStyle = rgb(P.cardBorder); c.lineWidth = 1; c.stroke();

  const padL = 18, padR = 18, barW = w - padL - padR;
  const logoSize = 16;
  drawAiLogo(c, p.id, padL, 13, logoSize, rgb(P.text1), () => { if (cv.isConnected) drawAiUsageCard(cv, spec); });
  c.font = FONT2; c.fillStyle = rgb(P.text1); c.textAlign = "left";
  c.fillText(`${p.name.toUpperCase()} USAGE`, padL + logoSize + 6, 14);
  c.font = FONT1; c.fillStyle = rgb(P.text2);
  c.fillText(p.plan.toUpperCase(), padL, 34);

  if (!p.signedIn) {
    box(padL, 68, barW, 12, 6, rgb(P.trackElapsed));
    box(padL, 122, barW, 12, 6, rgb(P.trackElapsed));
    c.font = FONT1; c.fillStyle = rgb(P.text2); c.textAlign = "center";
    c.fillText(p.unavailableCard || "NO DATA AVAILABLE", w / 2, 95);
    c.textAlign = "left";
    return;
  }

  const rows = [
    { label: "5-HOUR WINDOW", pct: p.shortPct, reset: p.shortReset, col: rgb(P.down), y: 60 },
    { label: "WEEKLY LIMIT", pct: p.weekPct, reset: p.weekReset, col: rgb(P.up), y: 115 },
  ];
  for (const row of rows) {
    const fillCol = row.pct === 0 ? "rgb(244, 63, 94)" : row.pct <= 25 ? "rgb(245, 158, 11)" : row.col;
    c.font = FONT1;
    c.fillStyle = rgb(P.text1); c.textAlign = "left";
    c.fillText(row.label, padL, row.y);
    c.fillStyle = row.pct === 0 ? "rgb(251, 113, 133)" : rgb(P.text1); c.textAlign = "right";
    c.fillText(`${row.pct}% REMAINING`, w - padR, row.y);

    const barY = row.y + 15, barH = 11;
    box(padL, barY, barW, barH, 5.5, rgb(P.trackElapsed));
    if (row.pct > 0) {
      const fw = Math.max(barH, Math.round(barW * Math.min(100, row.pct) / 100));
      box(padL, barY, fw, barH, 5.5, fillCol);
    }

    c.textAlign = "left";
    c.fillStyle = rgb(P.text2);
    c.fillText(`RESETS IN ${row.reset.toUpperCase()}`, padL, barY + 16);
    if (row.pct === 0) {
      c.textAlign = "right";
      c.fillStyle = "rgb(251, 113, 133)";
      c.fillText("LIMIT REACHED", w - padR, barY + 16);
    }
  }
  c.textAlign = "left";
}

function drawAiCompareCard(cv, spec) {
  const w = spec.w || 480, h = spec.h || 245;
  const P = spec.dark !== false ? PALETTES.dark : PALETTES.light;
  const ai = spec.ai;
  const isWeek = spec.win === "week";
  const dpr = Math.max(1, window.devicePixelRatio || 1);
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  sizeChartCanvas(cv, w);
  const c = cv.getContext("2d");
  upperCaseCanvasText(c);
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  c.textBaseline = "top";
  const box = (x, y, bw, bh, r, col) => { c.beginPath(); c.roundRect(x, y, bw, bh, r); c.fillStyle = col; c.fill(); };

  c.beginPath(); c.roundRect(0.5, 0.5, w - 1, h - 1, 12);
  c.fillStyle = rgb(P.cardBg); c.fill(); c.strokeStyle = rgb(P.cardBorder); c.lineWidth = 1; c.stroke();

  const padL = 18, padR = 18, barW = w - padL - padR;
  const title = isWeek ? "WEEKLY LIMIT" : "5-HOUR WINDOW";
  const providers = ai.providers.filter(p => !p.linkOnly);
  let tight = null;
  for (const p of providers) {
    if (!p.signedIn) continue;
    const pct = isWeek ? p.weekPct : p.shortPct;
    if (!tight || pct < tight.pct) tight = { name: p.name, pct };
  }
  const sub = tight
    ? `TIGHTEST: ${tight.name.toUpperCase()} ${tight.pct}%  |  CHECKED ${ai.updatedAt}`
    : `NO DATA  |  CHECKED ${ai.updatedAt}`;

  c.font = FONT2; c.fillStyle = rgb(P.text1); c.textAlign = "left";
  c.fillText(title, padL, 14);
  c.font = FONT1; c.fillStyle = rgb(P.text2);
  c.fillText(sub, padL, 34);

  const compact = h <= 190;
  const rowStart = compact ? 54 : 64;
  const rowStep = compact ? 38 : 54;
  const barOffset = compact ? 14 : 17;
  const barH = compact ? 11 : 16;
  const logoSize = compact ? 12 : 14;
  const logoOffsetY = compact ? -1.5 : -2.5;
  const nameX = padL + logoSize + 5;
  const accentCol = isWeek ? rgb(P.up) : rgb(P.down);
  const redraw = () => { if (cv.isConnected) drawAiCompareCard(cv, spec); };

  if (!compact && providers.length > 0) {
    const gTop = rowStart + barOffset - 4;
    const gBot = rowStart + (providers.length - 1) * rowStep + barOffset + barH + 4;
    c.strokeStyle = rgb(P.grid); c.lineWidth = 1; c.setLineDash([3, 3]);
    for (const frac of [0.25, 0.5, 0.75]) {
      const gx = Math.round(padL + barW * frac) + 0.5;
      c.beginPath(); c.moveTo(gx, gTop); c.lineTo(gx, gBot); c.stroke();
    }
    c.setLineDash([]);
  }

  providers.forEach((p, idx) => {
    const y = rowStart + idx * rowStep;
    const by = y + barOffset;

    if (!p.signedIn) {
      drawAiLogo(c, p.id, padL, y + logoOffsetY, logoSize, rgb(P.text2), redraw);
      c.font = FONT1;
      c.fillStyle = rgb(P.text2); c.textAlign = "left";
      c.fillText(p.name, nameX, y);
      c.textAlign = "right";
      c.fillText(p.unavailableSub || "No data", w - padR, y);
      box(padL, by, barW, barH, barH / 2, rgb(P.trackElapsed));
      return;
    }

    const pct = isWeek ? p.weekPct : p.shortPct;
    const reset = isWeek ? p.weekReset : p.shortReset;
    const tone = pctTone(pct);
    const fillCol = tone === "danger" ? "rgb(244, 63, 94)" : tone === "warn" ? "rgb(245, 158, 11)" : accentCol;
    const txtCol = tone === "danger" ? "rgb(251, 113, 133)" : tone === "warn" ? "rgb(251, 191, 36)" : rgb(P.text1);

    drawAiLogo(c, p.id, padL, y + logoOffsetY, logoSize, rgb(P.text1), redraw);
    c.font = FONT1;
    c.textAlign = "left";
    c.fillStyle = txtCol;
    c.fillText(`${p.name}  ${pct}%`, nameX, y);

    c.textAlign = "right";
    c.fillStyle = tone === "danger" ? "rgb(251, 113, 133)" : rgb(P.text2);
    c.fillText(`resets in ${reset}`, w - padR, y);

    box(padL, by, barW, barH, barH / 2, rgb(P.trackElapsed));
    if (pct > 0) {
      const fw = Math.max(barH, Math.round(barW * Math.min(100, pct) / 100));
      box(padL, by, fw, barH, barH / 2, fillCol);
    } else {
      c.beginPath(); c.roundRect(padL + 0.5, by + 0.5, barW - 1, barH - 1, barH / 2);
      c.strokeStyle = "rgba(244, 63, 94, 0.55)"; c.lineWidth = 1; c.stroke();
    }
  });

  if (!compact) {
    const scaleY = h - 20;
    c.font = FONT1; c.fillStyle = rgb(P.text2);
    c.textAlign = "left"; c.fillText("0%", padL, scaleY);
    c.textAlign = "center"; c.fillText("50%", padL + barW / 2, scaleY);
    c.textAlign = "right"; c.fillText("100%", w - padR, scaleY);
  }
  c.textAlign = "left";
}
