/* Working Folder band (DockBands/WorkingFolderDockBandItem.cs): one click opens the folder in File Explorer */
const wfExists = () => state.scenario !== "folder_missing";
function wfName(path) {
  const trimmed = path.replace(/[\\/]+$/, "");
  const i = trimmed.lastIndexOf("\\");
  return i < 0 || /^[A-Za-z]:$/.test(trimmed) ? path : trimmed.slice(i + 1);
}
function wfParent(path) {
  const trimmed = path.replace(/[\\/]+$/, "");
  if (/^[A-Za-z]:$/.test(trimmed)) return "Drive";
  const i = trimmed.lastIndexOf("\\");
  const parent = trimmed.slice(0, i);
  return /^[A-Za-z]:$/.test(parent) ? parent + "\\" : parent;
}
function wfOpenExplorer() {
  if (!wfExists()) { toast(`Folder not found: ${state.workFolder.path}`); return; }
  toast(`Would open ${state.workFolder.path} in File Explorer`);
}
function wfBand() {
  const path = state.workFolder.path;
  const more = [
    { icon: "\uE943", name: "Open in VS Code", run: () => toast(`Would open ${path} in VS Code`) },
    { icon: "\uE756", name: "Open in Terminal", run: () => toast(`Would open a terminal in ${path}`) },
    { icon: "\uE8C8", name: "Copy Path", run: () => toast(`Copied ${path}`) },
    { icon: "\uE70F", name: "Change Folder...", ...go("workFolderSettings") },
  ];
  return wfExists()
    ? { label: "Working Folder", run: wfOpenExplorer, icon: "\uE8B7", title: wfName(path), subtitle: wfParent(path), more }
    : { label: "Working Folder", page: "workFolderSettings", icon: "\uE7BA", title: "Folder missing", subtitle: path, more };
}

/* =====================================================================
   Chart renderer: port of NetworkChartRenderer.RenderBarChartPng
   ===================================================================== */
const PALETTES = {
  dark: { cardBg: [28, 32, 40], cardBorder: [52, 59, 74], grid: [44, 50, 64], axis: [68, 76, 94], trackElapsed: [36, 41, 52], trackFuture: [31, 35, 44], text1: [241, 245, 249], text2: [156, 168, 188], down: [56, 189, 248], downHi: [125, 211, 252], up: [167, 139, 250], upHi: [196, 181, 253], marker: [56, 189, 248] },
  light: { cardBg: [248, 250, 252], cardBorder: [218, 226, 236], grid: [226, 232, 240], axis: [196, 206, 220], trackElapsed: [235, 240, 246], trackFuture: [242, 245, 249], text1: [15, 23, 42], text2: [100, 116, 139], down: [2, 132, 199], downHi: [14, 165, 233], up: [124, 58, 237], upHi: [139, 92, 246], marker: [2, 132, 199] },
};
const rgb = c => `rgb(${c[0]},${c[1]},${c[2]})`;
const FONT1 = '600 9px "Cascadia Mono", Consolas, "Courier New", monospace';   // pixel font, scale 1
const FONT2 = '700 15px "Cascadia Mono", Consolas, "Courier New", monospace';  // pixel font, scale 2

function shouldDrawXLabel(i, count) {
  if (count <= 12) return true;
  if (count === 24) return [0, 4, 8, 12, 16, 20, 23].includes(i);
  const day = i + 1;
  return day === 1 || day === count || (day % 5 === 0 && (count - day) >= 2);
}

function drawChart(cv, spec) {
  const w = spec.w || 600, h = spec.h || 260, P = spec.dark ? PALETTES.dark : PALETTES.light;
  const dpr = Math.max(1, window.devicePixelRatio || 1);
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  sizeChartCanvas(cv, w);
  const c = cv.getContext("2d");
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  c.textBaseline = "top";
  const box = (x, y, bw, bh, r, color) => { c.beginPath(); c.roundRect(x, y, bw, bh, r); c.fillStyle = rgb(color); c.fill(); };

  c.beginPath(); c.roundRect(0.5, 0.5, w - 1, h - 1, 12);
  c.fillStyle = rgb(P.cardBg); c.fill(); c.strokeStyle = rgb(P.cardBorder); c.lineWidth = 1; c.stroke();

  let totalDown = 0, totalUp = 0, maxBucket = 0;
  for (const b of spec.buckets) { totalDown += b.rx; totalUp += b.tx; maxBucket = Math.max(maxBucket, b.rx + b.tx); }

  const padL = 18, padR = 18;
  const upperTitle = spec.title.toUpperCase();
  const upText = `UP ${formatBytes(totalUp)}`, downText = `DOWN ${formatBytes(totalDown)}`;
  c.font = FONT1;
  const upW = c.measureText(upText).width, downW = c.measureText(downText).width;
  const sw = 8, swGap = 5, lgGap = 12;
  const upX = w - padR - upW, upSwX = upX - swGap - sw, downX = upSwX - lgGap - downW, downSwX = downX - swGap - sw;
  c.font = FONT2;
  const big = padL + c.measureText(upperTitle).width + 12 <= downSwX;
  c.font = big ? FONT2 : FONT1; c.fillStyle = rgb(P.text1);
  c.fillText(upperTitle, padL, big ? 14 : 16);
  if (spec.subtitle) { c.font = FONT1; c.fillStyle = rgb(P.text2); c.fillText(spec.subtitle, padL, big ? 34 : 30); }

  // Same rule as NetworkChartRenderer (6 px per character): if the small title still runs into the legend,
  // the legend moves to its own row under the subtitle
  const px = s => s.length * 6 - 1;
  const downSwPx = w - padR - px(upText) - swGap - sw - lgGap - px(downText) - swGap - sw;
  const legendY = !big && padL + px(upperTitle) + 12 > downSwPx ? 44 : 16;

  c.font = FONT1;
  box(downSwX, legendY + 1, sw, sw, 2, P.down); c.fillStyle = rgb(P.text1); c.fillText(downText, downX, legendY);
  box(upSwX, legendY + 1, sw, sw, 2, P.up); c.fillStyle = rgb(P.text1); c.fillText(upText, upX, legendY);

  const plotL = 68, plotR = w - padR, plotT = 58, plotB = h - 34;
  const plotW = Math.max(40, plotR - plotL), plotH = Math.max(40, plotB - plotT);
  const yMax = niceCeiling(maxBucket), yMid = Math.floor(yMax / 2);

  c.strokeStyle = rgb(P.grid); c.setLineDash([3, 3]);
  for (const y of [plotT, plotT + Math.floor(plotH / 2)]) { c.beginPath(); c.moveTo(plotL, y + 0.5); c.lineTo(plotR, y + 0.5); c.stroke(); }
  c.setLineDash([]); c.strokeStyle = rgb(P.axis);
  c.beginPath(); c.moveTo(plotL, plotB + 0.5); c.lineTo(plotR, plotB + 0.5); c.stroke();

  c.fillStyle = rgb(P.text2); c.textAlign = "right";
  c.fillText(formatShortAxis(yMax), plotL - 8, plotT - 4);
  c.fillText(formatShortAxis(yMid), plotL - 8, plotT + Math.floor(plotH / 2) - 4);
  c.fillText("0", plotL - 8, plotB - 4);
  c.textAlign = "left";

  const count = spec.buckets.length;
  if (count === 0) return;
  const slot = plotW / count;
  const barW = Math.min(22, Math.max(3, Math.floor(slot * 0.66)));
  for (let i = 0; i < count; i++) {
    const cx = plotL + Math.round((i + 0.5) * slot), left = cx - Math.floor(barW / 2);
    const active = i === spec.active, future = spec.active >= 0 && i > spec.active;
    box(left, plotT + 2, barW, plotH - 2, 2, future ? P.trackFuture : P.trackElapsed);

    const b = spec.buckets[i], total = b.rx + b.tx;
    if (total > 0 && yMax > 0) {
      let totalPx = Math.round(total / yMax * (plotH - 2));
      totalPx = Math.min(plotH - 2, Math.max(3, totalPx));
      let downPx = b.rx > 0 ? Math.round(b.rx / total * totalPx) : 0, upPx = totalPx - downPx;
      if (b.rx > 0 && downPx === 0 && totalPx >= 2) { downPx = 1; upPx = totalPx - 1; }
      if (b.tx > 0 && upPx === 0 && totalPx >= 2) { upPx = 1; downPx = totalPx - 1; }
      const top = plotB - totalPx, dc = active ? P.downHi : P.down, uc = active ? P.upHi : P.up;
      const topRounded = (y, hh, col) => { c.beginPath(); c.roundRect(left, y, barW, hh, [2, 2, 0, 0]); c.fillStyle = rgb(col); c.fill(); };
      if (upPx > 0 && downPx > 0) { c.fillStyle = rgb(dc); c.fillRect(left, plotB - downPx, barW, downPx); topRounded(top, upPx, uc); }
      else if (downPx > 0) topRounded(top, downPx, dc);
      else if (upPx > 0) topRounded(top, upPx, uc);
    }
    if (active) { c.fillStyle = rgb(P.marker); c.fillRect(cx - Math.max(2, Math.floor(barW / 3)), plotB + 4, Math.max(4, Math.floor(barW * 2 / 3)), 2); }
      if (shouldDrawXLabel(i, count)) {
      const lbl = b.label, lw = c.measureText(lbl).width;
      const lx = Math.min(plotR - lw, Math.max(plotL, cx - lw / 2));
      c.fillStyle = rgb(active ? P.text1 : P.text2);
      c.fillText(lbl, lx, plotB + 10);
    }
  }
}

/* =====================================================================
   Prayer Schedule Card renderer: radial bar dial matching NetworkChartRenderer
   ===================================================================== */
function drawPrayerScheduleCard(cv, p) {
  const w = 820, h = 218;
  const P = PALETTES.dark; // Matches NetworkUsagePage chart palette (#1C2028 + cyan #38BDF8 + violet #A78BFA)
  const dpr = Math.max(1, window.devicePixelRatio || 1);
  cv.width = Math.round(w * dpr);
  cv.height = Math.round(h * dpr);
  const c = cv.getContext("2d");
  c.setTransform(dpr, 0, 0, dpr, 0, 0);

  const box = (x, y, bw, bh, r, col) => { c.beginPath(); c.roundRect(x, y, bw, bh, r); c.fillStyle = col; c.fill(); };
  const GRAY_BAR = "rgb(75, 85, 101)";
  const GRAY_PTR = "rgb(100, 116, 139)";
  const GRAY_TXT = "rgb(118, 131, 150)";

  c.save();
  // 1. Card surface & border (identical to NetworkChartRenderer)
  c.beginPath();
  c.roundRect(0.5, 0.5, w - 1, h - 1, 12);
  c.fillStyle = rgb(P.cardBg);
  c.fill();
  c.strokeStyle = rgb(P.cardBorder);
  c.lineWidth = 1;
  c.stroke();

  // 2. Top header row + legend swatches (mirrors NetworkChartRenderer header)
  const padL = 18, padR = 18;
  c.textBaseline = "top";
  c.textAlign = "left";
  c.font = FONT2;
  c.fillStyle = rgb(P.text1);
  c.fillText("PRAYER SCHEDULE", padL, 14);

  c.font = FONT1;
  c.fillStyle = rgb(P.text2);
  c.fillText(`${p.region.display.toUpperCase()}` + `  |  ${p.region.tz}  |  LOCAL ${hhmm(p.now)}`, padL, 34);

  // Top-right legend swatches: PASSED (gray), NEXT (cyan), UPCOMING (violet)
  const legends = [
    { col: GRAY_PTR, text: "PASSED" },
    { col: rgb(P.down), text: "COUNTDOWN" },
    { col: rgb(P.up), text: "UPCOMING" },
  ];
  c.font = FONT1;
  const sw = 8, swGap = 5, lgGap = 12;
  let lx = w - padR;
  for (let i = legends.length - 1; i >= 0; i--) {
    const tw = c.measureText(legends[i].text).width;
    lx -= tw;
    c.fillStyle = rgb(P.text1);
    c.fillText(legends[i].text, lx, 16);
    lx -= (swGap + sw);
    box(lx, 17, sw, sw, 2, legends[i].col);
    lx -= lgGap;
  }

  // Subtle background grid lines + horizon baseline
  const cx = w / 2, baseY = 198;
  c.strokeStyle = rgb(P.grid);
  c.lineWidth = 1;
  c.setLineDash([3, 3]);
  for (const gy of [96, 148]) {
    c.beginPath(); c.moveTo(padL, gy + 0.5); c.lineTo(w - padR, gy + 0.5); c.stroke();
  }
  c.setLineDash([]);
  c.strokeStyle = rgb(P.axis);
  c.beginPath(); c.moveTo(padL, baseY + 0.5); c.lineTo(w - padR, baseY + 0.5); c.stroke();

  // 3. Semicircular radial bar dial (61 bars spaced every 3 degrees from 180° to 0°)
  const totalBars = 60; // indices 0..60 -> 61 radial bars
  const milestoneIndices = [3, 13, 24, 36, 47, 57]; // Fajr, Sunrise, Dhuhr, Asr, Maghrib, Isha
  const anchors = [
    { k: 0, t: 0 },
    ...p.milestones.map((m, idx) => ({ k: milestoneIndices[idx], t: m.t })),
    { k: totalBars, t: 1440 },
  ];

  // Piecewise-linear map of current clock time -> bar position nowK
  let nowK = 0;
  for (let i = 0; i < anchors.length - 1; i++) {
    const a0 = anchors[i], a1 = anchors[i + 1];
    if (p.now >= a0.t && p.now <= a1.t) {
      const span = Math.max(1, a1.t - a0.t);
      nowK = a0.k + ((p.now - a0.t) / span) * (a1.k - a0.k);
      break;
    }
  }
  const targetMilestoneIdx = p.milestones.findIndex(m => m.name === p.cardPrayerName);
  const targetK = targetMilestoneIdx >= 0 ? milestoneIndices[targetMilestoneIdx] : -1;

  const rIn = 108, rOut = 122, rPtrIn = 103, rPtrOut = 136;

  // Ambient cyan/violet glow inside the active semicircle
  const innerGlow = c.createRadialGradient(cx, baseY - 36, 10, cx, baseY - 20, rOut);
  innerGlow.addColorStop(0, "rgba(56, 189, 248, 0.08)");
  innerGlow.addColorStop(1, "rgba(28, 32, 40, 0)");
  c.fillStyle = innerGlow;
  c.beginPath();
  c.arc(cx, baseY, rOut, Math.PI, Math.PI * 2, false);
  c.closePath();
  c.fill();

  // Draw all 61 radial bars around the semicircle
  c.lineCap = "round";
  for (let k = 0; k <= totalBars; k++) {
    const degAngle = 180 - k * 3;
    const rad = (degAngle * Math.PI) / 180;
    const cos = Math.cos(rad), sin = Math.sin(rad);

    const mIdx = milestoneIndices.indexOf(k);
    const isPointer = mIdx !== -1;
    const isTargetPtr = isPointer && mIdx === targetMilestoneIdx;
    const isPassed = p.tomorrow ? !isTargetPtr : (k <= nowK && !(isTargetPtr && p.cardLabel === "Prayer Time"));
    const isCountdownWindow = !p.tomorrow && k > nowK && targetK >= 0 && k <= targetK;

    const inner = isPointer ? rPtrIn : rIn;
    const outer = isPointer ? (isTargetPtr ? rPtrOut + 3 : rPtrOut) : rOut;

    let strokeCol;
    if (isTargetPtr) {
      strokeCol = rgb(P.downHi);
    } else if (isPassed) {
      strokeCol = isPointer ? GRAY_PTR : GRAY_BAR;
    } else if (isCountdownWindow) {
      strokeCol = rgb(P.down);
    } else {
      strokeCol = isPointer ? rgb(P.upHi) : "rgba(167, 139, 250, 0.45)";
    }

    // Subtle glow on the target prayer pointer bar
    if (isTargetPtr) {
      c.save();
      c.strokeStyle = "rgba(56, 189, 248, 0.32)";
      c.lineWidth = 8;
      c.beginPath();
      c.moveTo(cx + cos * inner, baseY - sin * inner);
      c.lineTo(cx + cos * outer, baseY - sin * outer);
      c.stroke();
      c.restore();
    }

    c.strokeStyle = strokeCol;
    c.lineWidth = isPointer ? (isTargetPtr ? 4 : 3.2) : 2.4;
    c.beginPath();
    c.moveTo(cx + cos * inner, baseY - sin * inner);
    c.lineTo(cx + cos * outer, baseY - sin * outer);
    c.stroke();
  }

  // 4. Prayer name + time labels attached to each of the 6 pointer bars
  cv._tileBounds = [];
  p.milestones.forEach((m, idx) => {
    const k = milestoneIndices[idx];
    const degAngle = 180 - k * 3;
    const rad = (degAngle * Math.PI) / 180;
    const cos = Math.cos(rad), sin = Math.sin(rad);

    const isTarget = idx === targetMilestoneIdx;
    const isPassed = p.tomorrow ? !isTarget : (m.t <= p.now && !(isTarget && p.cardLabel === "Prayer Time"));
    const onLeft = degAngle > 90;

    const tipX = cx + cos * (rPtrOut + 7);
    const tipY = baseY - sin * (rPtrOut + 5);
    const arrow = m.arrow === "up" ? " ↑" : (m.arrow === "down" ? " ↓" : "");
    const labelText = `${m.name.toUpperCase()}${arrow}  ${hhmm(m.t)}`;

    c.font = isTarget
      ? '700 11px "Cascadia Mono", Consolas, "Courier New", monospace'
      : FONT1;
    const tw = c.measureText(labelText).width;
    const pillPadX = 8, pillH = 20;
    const boxX = onLeft ? (tipX - tw - pillPadX * 2) : tipX;
    const boxY = tipY - pillH / 2;

    cv._tileBounds.push({ x1: boxX / w, x2: (boxX + tw + pillPadX * 2) / w, y1: boxY / h, y2: (boxY + pillH) / h, name: m.name, t: m.t });

    if (isTarget) {
      c.beginPath();
      c.roundRect(boxX, boxY, tw + pillPadX * 2, pillH, 10);
      c.fillStyle = "rgba(56, 189, 248, 0.14)";
      c.fill();
      c.strokeStyle = "rgba(56, 189, 248, 0.55)";
      c.lineWidth = 1;
      c.stroke();
      c.fillStyle = rgb(P.downHi);
    } else if (isPassed) {
      c.fillStyle = GRAY_TXT;
    } else {
      c.fillStyle = rgb(P.text1);
    }

    c.textAlign = "left";
    c.textBaseline = "middle";
    c.fillText(labelText, boxX + pillPadX, boxY + pillH / 2 + 0.5);
  });

  // 5. Center hero countdown inside the barred semicircle
  c.textAlign = "center";
  c.textBaseline = "middle";
  c.font = '700 25px "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif';
  c.fillStyle = rgb(P.text1);
  c.fillText(p.cardPrayerName, cx, baseY - 76);

  const pillText = p.cardLabel === "Prayer Time"
    ? `NOW  •  ${hhmm(p.now)}`
    : `TIME LEFT  •  ${Math.floor(p.until / 60)}H ${pad2(p.until % 60)}M`;
  c.font = FONT1;
  const pillW = Math.max(150, c.measureText(pillText).width + 24), pillH = 23;
  const pillX = cx - pillW / 2, pillY = baseY - 52;
  c.beginPath();
  c.roundRect(pillX, pillY, pillW, pillH, pillH / 2);
  c.fillStyle = "rgba(56, 189, 248, 0.12)";
  c.fill();
  c.strokeStyle = "rgba(56, 189, 248, 0.4)";
  c.lineWidth = 1;
  c.stroke();
  c.fillStyle = rgb(P.downHi);
  c.fillText(pillText, cx, pillY + pillH / 2 + 0.5);

  c.font = FONT1;
  c.fillStyle = rgb(P.text2);
  const nextSub = p.cardLabel === "Prayer Time"
    ? "PRAYER TIME REACHED"
    : `STARTS AT ${hhmm(p.next.t)}${p.tomorrow ? " (TOMORROW)" : ""}`;
  c.fillText(nextSub, cx, baseY - 15);

  c.restore();
}

/* =====================================================================
   AI Usage Limits card renderer (details pane PNG in C#)
   ===================================================================== */
// Command Palette scales ImageContent down to fit, but a Markdown image in a details pane is shown at
// its natural size and clipped, so details-pane charts are drawn full size here and the pane clips them.
function sizeChartCanvas(cv, w) {
  if (cv.closest && cv.closest(".details")) {
    cv.style.width = w + "px";
    cv.style.maxWidth = "none";
  } else {
    cv.style.maxWidth = w + "px";
  }
}

function drawAiUsageCard(cv, spec) {
  const w = spec.w || 300, h = spec.h || 175;
  const P = spec.dark ? PALETTES.dark : PALETTES.light;
  const p = spec.provider;
  const dpr = Math.max(1, window.devicePixelRatio || 1);
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  sizeChartCanvas(cv, w);
  const c = cv.getContext("2d");
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  c.textBaseline = "top";
  const box = (x, y, bw, bh, r, col) => { c.beginPath(); c.roundRect(x, y, bw, bh, r); c.fillStyle = col; c.fill(); };

  c.beginPath(); c.roundRect(0.5, 0.5, w - 1, h - 1, 12);
  c.fillStyle = rgb(P.cardBg); c.fill(); c.strokeStyle = rgb(P.cardBorder); c.lineWidth = 1; c.stroke();

  const padL = 18, padR = 18, barW = w - padL - padR;
  c.font = FONT2; c.fillStyle = rgb(P.text1); c.textAlign = "left";
  c.fillText(`${p.name.toUpperCase()} USAGE`, padL, 14);
  c.font = FONT1; c.fillStyle = rgb(P.text2);
  c.fillText(p.plan.toUpperCase(), padL, 34);

  if (!p.signedIn) {
    box(padL, 68, barW, 12, 6, rgb(P.trackElapsed));
    box(padL, 122, barW, 12, 6, rgb(P.trackElapsed));
    c.font = FONT1; c.fillStyle = rgb(P.text2); c.textAlign = "center";
    c.fillText(p.unavailableCard || "NO DATA AVAILABLE", w / 2, 95);
    c.textAlign = "left";
    return;
  }

  const rows = [
    { label: "5-HOUR WINDOW", pct: p.shortPct, reset: p.shortReset, col: rgb(P.down), y: 60 },
    { label: "WEEKLY LIMIT", pct: p.weekPct, reset: p.weekReset, col: rgb(P.up), y: 115 },
  ];
  for (const row of rows) {
    const fillCol = row.pct === 0 ? "rgb(244, 63, 94)" : row.pct <= 25 ? "rgb(245, 158, 11)" : row.col;
    c.font = FONT1;
    c.fillStyle = rgb(P.text1); c.textAlign = "left";
    c.fillText(row.label, padL, row.y);
    c.fillStyle = row.pct === 0 ? "rgb(251, 113, 133)" : rgb(P.text1); c.textAlign = "right";
    c.fillText(`${row.pct}% REMAINING`, w - padR, row.y);

    const barY = row.y + 15, barH = 11;
    box(padL, barY, barW, barH, 5.5, rgb(P.trackElapsed));
    if (row.pct > 0) {
      const fw = Math.max(barH, Math.round(barW * Math.min(100, row.pct) / 100));
      box(padL, barY, fw, barH, 5.5, fillCol);
    }

    c.textAlign = "left";
    c.fillStyle = rgb(P.text2);
    c.fillText(`RESETS IN ${row.reset.toUpperCase()}`, padL, barY + 16);
    if (row.pct === 0) {
      c.textAlign = "right";
      c.fillStyle = "rgb(251, 113, 133)";
      c.fillText("LIMIT REACHED", w - padR, barY + 16);
    }
  }
  c.textAlign = "left";
}

/* =====================================================================
   Pomodoro card & weekly stats renderers (PNG via C# renderer)
   ===================================================================== */
function drawPomodoroCard(cv, p) {
  const w = 480, h = 340;
  const dark = isDark();
  const dpr = Math.max(1, window.devicePixelRatio || 1);
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  const c = cv.getContext("2d");
  c.setTransform(dpr, 0, 0, dpr, 0, 0);

  const bg = dark ? "#1c2028" : "#ffffff";
  const border = dark ? "#343b4a" : "#e2e8f0";
  const fg = dark ? "#f1f5f9" : "#22252a";
  const muted = dark ? "#9ca8bc" : "#64748b";
  const track = dark ? "#2d3545" : "#e5e7eb";
  const ringCol = p.phase === "focus"
    ? (dark ? "#38bdf8" : "#2b2f36")
    : (dark ? "#34d399" : "#0d9488");

  c.beginPath(); c.roundRect(0.5, 0.5, w - 1, h - 1, 12);
  c.fillStyle = bg; c.fill(); c.strokeStyle = border; c.lineWidth = 1; c.stroke();

  // Header
  c.textBaseline = "top";
  c.textAlign = "left";
  c.font = '700 18px "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif';
  c.fillStyle = fg;
  c.fillText("Pomodoro", 24, 18);

  c.font = FONT1;
  c.textAlign = "right";
  c.fillStyle = muted;
  const statusTag = p.running ? "RUNNING" : (p.remainingSec < p.totalSec ? "PAUSED" : "READY");
  c.fillText(`${pomoPhaseSubtitle(p).toUpperCase()}  •  ${statusTag}`, w - 24, 24);

  // Progress ring
  const cx = w / 2, cy = 186, r = 108;
  const frac = p.totalSec > 0 ? Math.max(0, Math.min(1, p.remainingSec / p.totalSec)) : 0;

  c.lineWidth = 7;
  c.lineCap = "round";
  c.strokeStyle = track;
  c.beginPath(); c.arc(cx, cy, r, 0, Math.PI * 2); c.stroke();

  if (frac > 0) {
    const start = -Math.PI / 2;
    const end = start + Math.PI * 2 * frac;
    c.strokeStyle = ringCol;
    c.beginPath(); c.arc(cx, cy, r, start, end, false); c.stroke();
  }

  // Big MM:SS countdown
  c.textAlign = "center";
  c.textBaseline = "middle";
  c.font = '400 54px "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif';
  c.fillStyle = fg;
  c.fillText(formatMmSs(p.remainingSec), cx, cy - 12);

  // 4 session dashes under the time (completed = full, current = elapsed fraction)
  const count = p.sessionsPerCycle;
  const dashW = count <= 4 ? 32 : Math.max(18, Math.floor(144 / count));
  const gap = 8;
  const totalDashW = count * dashW + (count - 1) * gap;
  const dashX0 = cx - totalDashW / 2;
  const dashY = cy + 34;
  const elapsedFocus = p.phase === "focus" && p.totalSec > 0
    ? Math.max(0.18, Math.min(1, 1 - (p.remainingSec / p.totalSec)))
    : 0;
  const completedCount = p.phase === "long" ? count : (p.phase === "short" ? p.sessionIndex : p.sessionIndex - 1);

  for (let i = 0; i < count; i++) {
    const x = dashX0 + i * (dashW + gap);
    c.beginPath(); c.roundRect(x, dashY, dashW, 5, 2.5);
    c.fillStyle = track; c.fill();

    let fillRatio = 0;
    if (i < completedCount) fillRatio = 1;
    else if (p.phase === "focus" && i === p.sessionIndex - 1) fillRatio = elapsedFocus;

    if (fillRatio > 0) {
      const fw = Math.max(6, Math.round(dashW * fillRatio));
      c.beginPath(); c.roundRect(x, dashY, fw, 5, 2.5);
      c.fillStyle = ringCol; c.fill();
    }
  }
}

function drawPomodoroStatsChart(cv, p) {
  const w = 600, h = 220;
  const P = PALETTES.dark;
  const dpr = Math.max(1, window.devicePixelRatio || 1);
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  cv.style.maxWidth = w + "px";
  const c = cv.getContext("2d");
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  c.textBaseline = "top";
  const box = (x, y, bw, bh, r, col) => { c.beginPath(); c.roundRect(x, y, bw, bh, r); c.fillStyle = col; c.fill(); };

  c.beginPath(); c.roundRect(0.5, 0.5, w - 1, h - 1, 12);
  c.fillStyle = rgb(P.cardBg); c.fill(); c.strokeStyle = rgb(P.cardBorder); c.lineWidth = 1; c.stroke();

  const weekTotal = p.weekDays.reduce((s, d) => s + d.sessions, 0);
  const padL = 18, padR = 18;
  c.font = FONT2; c.fillStyle = rgb(P.text1); c.textAlign = "left";
  c.fillText("POMODORO SESSIONS (7 DAYS)", padL, 14);
  c.font = FONT1; c.fillStyle = rgb(P.text2);
  c.fillText(`TODAY: ${p.todaySessions} SESSIONS (${p.todaySessions * p.focusMin}M)  |  WEEK: ${weekTotal} SESSIONS`, padL, 34);

  const plotL = 44, plotR = w - padR, plotT = 58, plotB = h - 32;
  const plotW = plotR - plotL, plotH = plotB - plotT;
  const maxS = Math.max(4, ...p.weekDays.map(d => d.sessions));
  const yMax = Math.ceil(maxS / 2) * 2;

  c.strokeStyle = rgb(P.grid); c.setLineDash([3, 3]);
  for (const y of [plotT, plotT + Math.floor(plotH / 2)]) {
    c.beginPath(); c.moveTo(plotL, y + 0.5); c.lineTo(plotR, y + 0.5); c.stroke();
  }
  c.setLineDash([]); c.strokeStyle = rgb(P.axis);
  c.beginPath(); c.moveTo(plotL, plotB + 0.5); c.lineTo(plotR, plotB + 0.5); c.stroke();

  c.fillStyle = rgb(P.text2); c.textAlign = "right";
  c.fillText(String(yMax), plotL - 8, plotT - 4);
  c.fillText(String(yMax / 2), plotL - 8, plotT + Math.floor(plotH / 2) - 4);
  c.fillText("0", plotL - 8, plotB - 4);

  const count = p.weekDays.length;
  const slot = plotW / count;
  const barW = Math.min(34, Math.floor(slot * 0.52));
  p.weekDays.forEach((d, i) => {
    const cx = plotL + Math.round((i + 0.5) * slot), left = cx - Math.floor(barW / 2);
    const isToday = i === count - 1;
    box(left, plotT + 2, barW, plotH - 2, 4, rgb(P.trackElapsed));
    if (d.sessions > 0) {
      const bh = Math.max(6, Math.round((d.sessions / yMax) * (plotH - 2)));
      box(left, plotB - bh, barW, bh, 4, rgb(isToday ? P.downHi : P.down));
      c.font = FONT1; c.textAlign = "center"; c.fillStyle = rgb(P.text1);
      c.fillText(String(d.sessions), cx, Math.max(plotT, plotB - bh - 13));
    }
    c.font = FONT1; c.textAlign = "center";
    c.fillStyle = rgb(isToday ? P.text1 : P.text2);
    c.fillText(isToday ? `${d.label}*` : d.label, cx, plotB + 9);
  });
  c.textAlign = "left";
}

/* =====================================================================
   Tiny markdown renderer (only what DockPulse's MarkdownContent uses)
   ===================================================================== */
const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
function inline(s) {
  return esc(s)
    .replace(/!\[([^\]]*)\]\(chart:([\w-]+)\)/g, '<canvas class="chart" data-chart="$2" role="img" aria-label="$1"></canvas>')
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[\s(])_(.+?)_(?=$|[\s.,)])/g, "$1<em>$2</em>");
}
function mdTable(rows) {
  const cells = r => r.split("|").slice(1, -1).map(x => x.trim());
  const head = cells(rows[0]);
  const align = cells(rows[1]).map(a => a.endsWith(":") ? "right" : "left");
  let html = "<table><thead><tr>" + head.map((h, i) => `<th style="text-align:${align[i]}">${inline(h)}</th>`).join("") + "</tr></thead><tbody>";
  for (const r of rows.slice(2)) html += "<tr>" + cells(r).map((x, i) => `<td style="text-align:${align[i]}">${inline(x)}</td>`).join("") + "</tr>";
  return html + "</tbody></table>";
}
function md(src) {
  const lines = src.split("\n");
  let html = "", para = [];
  const flush = () => {
    if (!para.length) return;
    html += "<p>" + para.map((l, i) => inline(l.replace(/\s+$/, "")) + (i < para.length - 1 ? (/ {2}$/.test(l) ? "<br>" : " ") : "")).join("") + "</p>";
    para = [];
  };
  for (let i = 0; i < lines.length; i++) {
    const l = lines[i];
    if (/^###\s/.test(l)) { flush(); html += `<h3>${inline(l.slice(4))}</h3>`; continue; }
    if (/^\|/.test(l)) { flush(); const rows = []; while (i < lines.length && /^\|/.test(lines[i])) rows.push(lines[i++]); i--; html += mdTable(rows); continue; }
    if (l.trim() === "") { flush(); continue; }
    para.push(l);
  }
  flush();
  return `<div class="md">${html}</div>`;
}

/* =====================================================================
   Rendering
   ===================================================================== */
const $ = id => document.getElementById(id);
let current = null;      // current page object
let visibleItems = [];   // filtered list items

function currentPage() { return PAGES[state.stack[state.stack.length - 1]](); }

function render() {
  current = currentPage();
  renderDock();
  renderTop();
  renderBody();
  renderBar();
}

function renderDock() {
  const dock = $("dock");
  dock.innerHTML = "";
  const open = state.stack[state.stack.length - 1];
  for (const b of dockBands()) {
    const el = document.createElement("button");
    el.className = "band" + (b.page === open ? " open" : "");
    el.title = b.label;
    el.innerHTML = `<span class="ic">${b.icon}</span><span><div class="t">${esc(b.title)}</div><div class="s">${esc(b.subtitle)}</div></span>`;
    // A band either opens its page or, like Working Folder, runs its command directly
    el.addEventListener("click", () => { if (b.run) { b.run(); render(); } else openPage(b.page, true); });
    el.addEventListener("contextmenu", e => { e.preventDefault(); showMenu(b.more, e.clientX, e.clientY); });
    if (b.quickAction) {
      const grp = document.createElement("div");
      grp.className = "band-group";
      grp.appendChild(el);
      const qa = document.createElement("button");
      qa.className = "band band-icon";
      qa.title = b.quickAction.title;
      qa.setAttribute("aria-label", b.quickAction.title);
      qa.innerHTML = `<span class="ic">${b.quickAction.icon}</span>`;
      qa.addEventListener("click", e => { e.stopPropagation(); b.quickAction.run(); render(); });
      qa.addEventListener("contextmenu", e => { e.preventDefault(); showMenu(b.more, e.clientX, e.clientY); });
      grp.appendChild(qa);
      dock.appendChild(grp);
    } else {
      dock.appendChild(el);
    }
  }
}

function renderFormBlock(form) {
  const card = document.createElement("form");
  card.className = "form-card" + (form.compact ? " compact" : "");
  card.noValidate = true;

  if (form.title) {
    const h = document.createElement("h3");
    h.className = "form-title";
    h.textContent = form.title;
    card.appendChild(h);
  }
  if (form.desc) {
    const p = document.createElement("p");
    p.className = "form-desc";
    p.textContent = form.desc;
    card.appendChild(p);
  }

  const inputs = {};
  const makeField = f => {
    if (f.type === "toggle") {
      const lbl = document.createElement("label");
      lbl.className = "form-toggle";
      const cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = Boolean(f.value);
      inputs[f.id] = () => cb.checked;
      lbl.appendChild(cb);
      const sp = document.createElement("span");
      sp.textContent = f.label;
      lbl.appendChild(sp);
      return lbl;
    }
    const wrap = document.createElement("div");
    wrap.className = "form-field";
    const lbl = document.createElement("label");
    lbl.className = "form-label";
    lbl.textContent = f.label;
    const inp = document.createElement("input");
    inp.className = "form-input";
    inp.type = f.type || "text";
    if (f.placeholder) inp.placeholder = f.placeholder;
    if (f.min !== undefined) inp.min = String(f.min);
    if (f.max !== undefined) inp.max = String(f.max);
    inp.value = f.value !== undefined ? String(f.value) : "";
    inputs[f.id] = () => inp.value;
    wrap.appendChild(lbl);
    wrap.appendChild(inp);
    return wrap;
  };

  for (const f of form.fields || []) {
    if (f.row) {
      const row = document.createElement("div");
      row.className = "form-row";
      f.row.forEach(sub => row.appendChild(makeField(sub)));
      card.appendChild(row);
    } else {
      card.appendChild(makeField(f));
    }
  }

  const errEl = document.createElement("p");
  errEl.className = "form-err";
  errEl.hidden = true;
  card.appendChild(errEl);

  const readValues = () => {
    const out = {};
    for (const [k, fn] of Object.entries(inputs)) out[k] = fn();
    return out;
  };
  const trigger = actionId => {
    const err = form.onAction && form.onAction(actionId, readValues());
    if (typeof err === "string" && err) { errEl.textContent = err; errEl.hidden = false; }
    else { errEl.hidden = true; }
  };

  if (form.actions && form.actions.length) {
    const bar = document.createElement("div");
    bar.className = "form-actions";
    for (const a of form.actions) {
      const btn = document.createElement("button");
      btn.type = a.submit ? "submit" : "button";
      btn.className = "form-btn" + (a.primary ? " primary" : "");
      btn.innerHTML = (a.icon ? `<span class="ic">${a.icon}</span>` : "") + `<span>${esc(a.label)}</span>`;
      if (!a.submit) btn.addEventListener("click", () => trigger(a.id));
      bar.appendChild(btn);
    }
    card.appendChild(bar);
  }

  card.addEventListener("submit", e => {
    e.preventDefault();
    const sub = (form.actions || []).find(a => a.submit) || (form.actions || [])[0];
    if (sub) trigger(sub.id);
  });
  return card;
}

function renderTop() {
  const top = $("palTop");
  const root = state.stack.length === 1;
  top.innerHTML = root
    ? `<span class="lead ic"></span>`
    : `<button class="lead ic" id="backBtn" title="Back (Esc)"></button>`;
  const input = document.createElement("input");
  input.id = "search";
  input.autocomplete = "off";
  input.spellcheck = false;
  if (current.kind === "content") { input.disabled = true; input.placeholder = current.title; }
  else { input.placeholder = current.placeholder; input.value = state.filter; }
  input.addEventListener("input", () => { state.filter = input.value; state.sel = 0; renderBody(); renderBar(); });
  top.appendChild(input);
  if (!root) $("backBtn").addEventListener("click", goBack);
  if (!input.disabled) input.focus({ preventScroll: true });
}

function renderBody() {
  const body = $("palBody");
  body.innerHTML = "";
  body.className = "pal-body" + (current.showDetails ? " split" : "");
  if (current.kind === "content") {
    const wrap = document.createElement("div");
    wrap.className = "content";
    for (const block of current.content) {
      if (block.chart) {
        const cv = document.createElement("canvas");
        cv.className = "chart";
        wrap.appendChild(cv);
        drawChart(cv, block.chart);
      } else if (block.pomo) {
        const cv = document.createElement("canvas");
        cv.className = "pomo-card";
        cv.setAttribute("data-pomo", "1");
        cv.setAttribute("role", "img");
        cv.setAttribute("aria-label", `Pomodoro ${formatMmSs(block.pomo.remainingSec)}`);
        wrap.appendChild(cv);
        drawPomodoroCard(cv, block.pomo);
      } else if (block.pomoStats) {
        const cv = document.createElement("canvas");
        cv.className = "chart";
        wrap.appendChild(cv);
        drawPomodoroStatsChart(cv, block.pomoStats);
      } else if (block.form) {
        wrap.appendChild(renderFormBlock(block.form));
      } else {
        wrap.insertAdjacentHTML("beforeend", md(block.md));
      }
    }
    body.appendChild(wrap);
    visibleItems = [];
    const firstInp = wrap.querySelector(".form-input");
    if (firstInp) firstInp.focus({ preventScroll: true });
    return;
  }

  const q = state.filter.trim().toLowerCase();
  const baseItems = current.items.filter(it => !q || (it.title + " " + (it.subtitle || "")).toLowerCase().includes(q));
  const extraItems = current.dynamicItems ? current.dynamicItems(state.filter) : [];
  visibleItems = [...baseItems, ...extraItems];
  state.sel = Math.min(state.sel, Math.max(0, visibleItems.length - 1));

  const list = document.createElement("div");
  list.className = "list" + (current.showDetails ? " with-details" : "");
  list.setAttribute("role", "listbox");
  if (current.headerCard && !q) {
    const cardWrap = document.createElement("div");
    cardWrap.className = "prayer-card-wrap";
    const cv = document.createElement("canvas");
    cv.className = "prayer-card";
    cv.setAttribute("role", "img");
    cv.setAttribute("aria-label", `Next prayer ${current.headerCard.cardPrayerName}`);
    cv.addEventListener("click", e => {
      const r = cv.getBoundingClientRect();
      const nx = (e.clientX - r.left) / r.width, ny = (e.clientY - r.top) / r.height;
      const hit = (cv._tileBounds || []).find(b => nx >= b.x1 && nx <= b.x2 && ny >= b.y1 && ny <= b.y2);
      if (hit) toast(`Copied “${hit.name}: ${hhmm(hit.t)} (${current.headerCard.region.city})”`);
    });
    cardWrap.appendChild(cv);
    list.appendChild(cardWrap);
    drawPrayerScheduleCard(cv, current.headerCard);
  }
  if (visibleItems.length === 0) list.insertAdjacentHTML("beforeend", `<div class="empty">No results</div>`);
  let lastSection = "";
  visibleItems.forEach((it, i) => {
    if (it.section && it.section !== lastSection) {
      lastSection = it.section;
      const hdr = document.createElement("div");
      hdr.className = "sec-hdr";
      if (current.headerCard && !q) { hdr.style.marginTop = "6px"; hdr.style.borderTop = "1px solid var(--stroke)"; hdr.style.paddingTop = "10px"; }
      hdr.textContent = it.section;
      list.appendChild(hdr);
    }
    const row = document.createElement("div");
    row.className = "row" + (i === state.sel ? " sel" : "");
    row.setAttribute("role", "option");
    const tagsHtml = it.tags && it.tags.length
      ? `<div class="tags">${it.tags.map(t => typeof t === "string"
        ? `<span class="tag">${esc(t)}</span>`
        : `<span class="tag${t.tone ? " " + esc(t.tone) : ""}">${esc(t.text)}</span>`).join("")}</div>`
      : "";
    row.innerHTML =
      `<span class="ic">${it.icon}</span>` +
      `<div class="txt"><div class="ti">${esc(it.title)}</div>${it.subtitle ? `<div class="su">${esc(it.subtitle)}</div>` : ""}</div>` +
      tagsHtml;
    row.addEventListener("click", () => selectRow(i));
    row.addEventListener("dblclick", () => invoke(it.cmd));
    row.addEventListener("contextmenu", e => { e.preventDefault(); selectRow(i); if (it.more) showMenu(it.more, e.clientX, e.clientY); });
    list.appendChild(row);
  });
  body.appendChild(list);

  if (current.showDetails) {
    const det = document.createElement("div");
    det.className = "details";
    det.id = "details";
    body.appendChild(det);
  }
  selectRow(state.sel);
}

// Moves the selection without rebuilding rows (so double-click lands on the same element)
function selectRow(i) {
  state.sel = i;
  document.querySelectorAll("#palBody .row").forEach((r, j) => r.classList.toggle("sel", j === i));
  const selRow = document.querySelector("#palBody .row.sel");
  if (selRow) selRow.scrollIntoView({ block: "nearest" });
  const det = $("details");
  if (det) {
    const it = visibleItems[i];
    det.innerHTML = it && it.details ? `<h2>${esc(it.details.title)}</h2>` + md(it.details.body) : "";
    det.querySelectorAll("canvas[data-chart]").forEach(cv => {
      const spec = current.charts[cv.dataset.chart];
      if (spec) {
        if (spec.kind === "aiBars") drawAiUsageCard(cv, spec);
        else drawChart(cv, spec);
      }
    });
  }
  renderBar();
}

function renderBar() {
  $("barIcon").textContent = current.icon;
  $("barTitle").textContent = current.title;
  const it = visibleItems[state.sel];
  const primary = current.kind === "list" ? (it ? it.cmd : null) : (current.primaryCmd || null);
  $("primaryBtn").hidden = !primary;
  $("primaryName").textContent = primary ? primary.name : "";
  const actions = current.kind === "content" ? current.commands : (it && it.more);
  $("actionsBtn").hidden = !(actions && actions.length);
  $("barSep").hidden = !primary || $("actionsBtn").hidden;
}

/* =====================================================================
   Behaviour
   ===================================================================== */
function openPage(id, fromDock) {
  hideMenu();
  state.stack = fromDock ? ["home", id] : [...state.stack, id];
  state.filter = ""; state.sel = 0;
  render();
}
function goBack() {
  hideMenu();
  if (state.stack.length > 1) state.stack.pop();
  state.filter = ""; state.sel = 0;
  render();
}
function invoke(cmd) {
  if (!cmd) return;
  hideMenu();
  if (cmd.page) { openPage(cmd.page, false); return; }
  if (cmd.run) cmd.run();
  if (cmd.back) { goBack(); return; }
  render();
}

let menuItems = [], menuSel = -1;
function showMenu(items, x, y) {
  if (!items || !items.length) return;
  const menu = $("menu");
  menuItems = items; menuSel = -1;
  menu.innerHTML = "";
  items.forEach(it => {
    const b = document.createElement("button");
    b.setAttribute("role", "menuitem");
    b.innerHTML = `<span class="ic">${it.icon || ""}</span><span>${esc(it.name)}</span>`;
    b.addEventListener("click", e => { e.stopPropagation(); invoke(it); });
    menu.appendChild(b);
  });
  menu.hidden = false;
  const r = menu.getBoundingClientRect();
  menu.style.left = Math.max(8, Math.min(x, innerWidth - r.width - 8)) + "px";
  menu.style.top = Math.max(8, Math.min(y, innerHeight - r.height - 8)) + "px";
}
function hideMenu() { $("menu").hidden = true; menuItems = []; }
function toggleActions() {
  if (!$("menu").hidden) { hideMenu(); return; }
  const it = visibleItems[state.sel];
  const items = current.kind === "content" ? current.commands : (it && it.more);
  const r = $("actionsBtn").getBoundingClientRect();
  showMenu(items, r.right - 260, r.top - 8 - (items ? items.length * 34 + 8 : 0));
}

let toastTimer = 0;
function toast(msg) {
  const t = $("toast");
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, 2200);
}

function showWinNotifCustom(icon, title, body) {
  $("wnIcon").textContent = icon;
  $("wnTitle").textContent = title;
  $("wnBody").textContent = body;
  $("winNotif").hidden = false;
}
function showWinNotif(prayerName, timeStr, regionDisplay) {
  showWinNotifCustom(prayerGlyph(prayerName), `${prayerName} Prayer Time — ${timeStr}`, `It is now time for ${prayerName} in ${regionDisplay}.`);
}
function hideWinNotif() { $("winNotif").hidden = true; }
function checkPrayerNotification() {
  if (!state.prayer.notifications) { hideWinNotif(); return; }
  const p = buildPrayer();
  const reached = p.entries.find(e => e.obligatory && e.t === state.clock);
  if (reached) showWinNotif(reached.name, hhmm(reached.t), p.region.display);
  else hideWinNotif();
}
$("wnClose").addEventListener("click", hideWinNotif);

document.addEventListener("click", e => { if (!$("menu").contains(e.target) && e.target !== $("actionsBtn") && !$("actionsBtn").contains(e.target)) hideMenu(); });
$("primaryBtn").addEventListener("click", () => {
  if (current.kind === "content") { invoke(current.primaryCmd); return; }
  const it = visibleItems[state.sel];
  if (it) invoke(it.cmd);
});
$("actionsBtn").addEventListener("click", e => { e.stopPropagation(); toggleActions(); });

document.addEventListener("keydown", e => {
  // Leave the preview toolbar's own inputs alone (theme buttons only keep Enter/Space)
  const t = e.target;
  if (t.closest && t.closest(".controls") && (t.tagName !== "BUTTON" || e.key === "Enter" || e.key === " ")) return;
  const menuOpen = !$("menu").hidden;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); toggleActions(); return; }
  if (menuOpen) {
    const buttons = [...$("menu").querySelectorAll("button")];
    if (e.key === "Escape") { e.preventDefault(); hideMenu(); return; }
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      menuSel = (menuSel + (e.key === "ArrowDown" ? 1 : -1) + buttons.length) % buttons.length;
      buttons.forEach((b, i) => b.classList.toggle("sel", i === menuSel));
      return;
    }
    if (e.key === "Enter" && menuSel >= 0) { e.preventDefault(); invoke(menuItems[menuSel]); return; }
    return;
  }
  if (t.closest && t.closest(".form-card")) {
    if (e.key === "Escape") { e.preventDefault(); goBack(); }
    return;
  }
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    if (!visibleItems.length) return;
    e.preventDefault();
    selectRow((state.sel + (e.key === "ArrowDown" ? 1 : -1) + visibleItems.length) % visibleItems.length);
  } else if (e.key === "Enter") {
    if (current.kind === "content" && current.primaryCmd) { e.preventDefault(); invoke(current.primaryCmd); return; }
    const it = visibleItems[state.sel];
    if (it) { e.preventDefault(); invoke(it.cmd); }
  } else if (e.key === "Escape") {
    e.preventDefault();
    if (state.filter) { state.filter = ""; state.sel = 0; render(); } else goBack();
  } else if (e.key === "Backspace" && !state.filter && state.stack.length > 1 && (e.target.id === "search" || e.target === document.body)) {
    e.preventDefault(); goBack();
  }
});

// Preview toolbar
function setTheme(t) {
  state.theme = t;
  if (t === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", t);
  document.querySelectorAll("[data-theme-btn]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.themeBtn === t)));
  try { localStorage.setItem("dockpulse-preview-theme", t); } catch (_) { /* storage unavailable */ }
  render();
}
document.querySelectorAll("[data-theme-btn]").forEach(b => b.addEventListener("click", () => setTheme(b.dataset.themeBtn)));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { if (state.theme === "auto") render(); });

$("scenario").addEventListener("change", e => {
  state.scenario = e.target.value;
  state.prayer = state.scenario === "tehran"
    ? { ...state.prayer, regionId: "tehran", methodId: "tehran", asr: "Standard" }
    : { ...state.prayer, regionId: "kabul", methodId: "karachi", asr: "Hanafi" };

  if (state.scenario === "normal") {
    state.clock = T("14:11"); $("clock").value = "14:11";
    state.wireless = { pinnedId: "mouse-pro-x2", pinnedName: "PRO X2 SUPERSTRIKE" };
    state.today.coffeeDone = true;
    state.pomodoro.running = false;
    state.pomodoro.phase = "focus";
    state.pomodoro.sessionIndex = 1;
    state.pomodoro.totalSec = state.pomodoro.focusMin * 60;
    state.pomodoro.remainingSec = state.pomodoro.totalSec;
  } else {
    state.pomodoro.running = false;
  }

  if (state.scenario === "prayertime") {
    state.clock = T("15:01"); $("clock").value = "15:01";
    state.prayer.notifications = true;
    state.stack = ["home", "prayer"];
  } else if (state.scenario === "ai_limit" || state.scenario === "ai_nosignin") {
    state.stack = ["home", "aiUsage"];
  } else if (state.scenario === "bt_fallback") {
    state.wireless = { pinnedId: "airpods-pro-3", pinnedName: "AirPods Pro 3" };
    state.stack = ["home", "wireless"];
  } else if (state.scenario === "coffee_due") {
    state.clock = T("10:05"); $("clock").value = "10:05";
    state.today.coffeeDone = false;
    state.stack = ["home", "today"];
  } else if (state.scenario === "pomodoro_running") {
    state.pomodoro.phase = "focus";
    state.pomodoro.sessionIndex = 2;
    state.pomodoro.totalSec = state.pomodoro.focusMin * 60;
    state.pomodoro.remainingSec = 18 * 60 + 42;
    state.pomodoro.running = true;
    state.stack = ["home", "pomodoro"];
  }
  state.filter = "";
  state.sel = 0;
  render();
  checkPrayerNotification();
  if (state.scenario === "coffee_due") {
    showWinNotifCustom("\uEC32", `Coffee Time — ${hhmm(state.today.coffeeTime)}`, "Time for your daily coffee! Check it off in DockPulse Today.");
  }
});
$("clock").addEventListener("input", e => {
  if (!e.target.value) return;
  state.clock = T(e.target.value);
  render();
  checkPrayerNotification();
});
window.addEventListener("resize", () => { if (current) { renderBody(); } });

// Live 1-second Pomodoro countdown ticker for the preview
setInterval(() => {
  if (!state.pomodoro.running) return;
  state.pomodoro.remainingSec -= 1;
  if (state.pomodoro.remainingSec <= 0) {
    pomoAdvance(true);
    render();
    return;
  }
  renderDock();
  const cv = document.querySelector("canvas[data-pomo]");
  if (cv) drawPomodoroCard(cv, state.pomodoro);
}, 1000);

let savedTheme = "auto";
try { savedTheme = localStorage.getItem("dockpulse-preview-theme") || "auto"; } catch (_) { /* storage unavailable */ }
setTheme(["auto", "light", "dark"].includes(savedTheme) ? savedTheme : "auto");
</script>
</body>
</html>
