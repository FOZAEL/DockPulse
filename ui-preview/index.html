<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DockPulse UI Preview</title>
<!--
  DockPulse UI preview (approximate). Double-click this file to open it in a browser; no build needed.

  - Texts, tags, icons and layout mirror DockBands/*.cs, Pages/*.cs and Services/NetworkChartRenderer.cs.
  - All numbers are fake: see the MOCK DATA section in the script. "Scenario" switches between data sets.
  - PowerToys Command Palette draws the real UI, so spacing and fonts here are close, not exact.
  - Icons use the Windows "Segoe Fluent Icons" font with the same glyph codes as the C# IconInfo values.

  Workflow for UI changes: edit this file first, review it in the browser, then change the C# to match.
-->
<style>
  :root {
    --desk-a: #dbe6f6; --desk-b: #a9c1e8; --desk-c: #eef2f9;
    --surface: rgba(249, 249, 249, .95);
    --stroke: rgba(0, 0, 0, .08); --stroke-strong: rgba(0, 0, 0, .15);
    --text: #1b1b1b; --text-2: rgba(0, 0, 0, .62); --text-3: rgba(0, 0, 0, .45);
    --row-hover: rgba(0, 0, 0, .035); --row-sel: rgba(0, 0, 0, .065);
    --accent: #005fb8;
    --tag-bg: rgba(0, 0, 0, .035); --tag-stroke: rgba(0, 0, 0, .1);
    --dock: rgba(243, 243, 243, .88); --menu: #fbfbfb; --kbd: rgba(0, 0, 0, .06);
    --toolbar: #ffffff; --input: rgba(255, 255, 255, .8);
    --shadow: 0 18px 50px rgba(0, 0, 0, .18), 0 2px 8px rgba(0, 0, 0, .08);
    --md-table: rgba(0, 0, 0, .03);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --desk-a: #0d1b36; --desk-b: #1e2f57; --desk-c: #0b0d14;
      --surface: rgba(32, 32, 32, .95);
      --stroke: rgba(255, 255, 255, .08); --stroke-strong: rgba(255, 255, 255, .15);
      --text: #ffffff; --text-2: rgba(255, 255, 255, .72); --text-3: rgba(255, 255, 255, .5);
      --row-hover: rgba(255, 255, 255, .04); --row-sel: rgba(255, 255, 255, .075);
      --accent: #60cdff;
      --tag-bg: rgba(255, 255, 255, .05); --tag-stroke: rgba(255, 255, 255, .1);
      --dock: rgba(32, 32, 32, .84); --menu: #2c2c2c; --kbd: rgba(255, 255, 255, .08);
      --toolbar: #1c1c1c; --input: rgba(255, 255, 255, .05);
      --shadow: 0 18px 50px rgba(0, 0, 0, .55), 0 2px 8px rgba(0, 0, 0, .3);
      --md-table: rgba(255, 255, 255, .03);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --desk-a: #0d1b36; --desk-b: #1e2f57; --desk-c: #0b0d14;
    --surface: rgba(32, 32, 32, .95);
    --stroke: rgba(255, 255, 255, .08); --stroke-strong: rgba(255, 255, 255, .15);
    --text: #ffffff; --text-2: rgba(255, 255, 255, .72); --text-3: rgba(255, 255, 255, .5);
    --row-hover: rgba(255, 255, 255, .04); --row-sel: rgba(255, 255, 255, .075);
    --accent: #60cdff;
    --tag-bg: rgba(255, 255, 255, .05); --tag-stroke: rgba(255, 255, 255, .1);
    --dock: rgba(32, 32, 32, .84); --menu: #2c2c2c; --kbd: rgba(255, 255, 255, .08);
    --toolbar: #1c1c1c; --input: rgba(255, 255, 255, .05);
    --shadow: 0 18px 50px rgba(0, 0, 0, .55), 0 2px 8px rgba(0, 0, 0, .3);
    --md-table: rgba(255, 255, 255, .03);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--desk-c);
    color: var(--text);
    font: 14px/1.4 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    display: flex; flex-direction: column;
  }
  .ic {
    font-family: "Segoe Fluent Icons", "Segoe MDL2 Assets";
    font-style: normal; font-weight: normal; line-height: 1;
    display: inline-flex; align-items: center; justify-content: center;
  }
  button { font: inherit; color: inherit; }

  /* ---------- preview toolbar (not part of DockPulse) ---------- */
  .toolbar {
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px;
    padding: 10px 16px; background: var(--toolbar);
    border-bottom: 1px solid var(--stroke);
  }
  .brand { font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .badge {
    font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px;
    background: var(--tag-bg); border: 1px solid var(--tag-stroke); color: var(--text-2);
  }
  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; margin-left: auto; }
  .controls label { display: flex; align-items: center; gap: 6px; color: var(--text-2); font-size: 13px; }
  .controls select, .controls input {
    font: inherit; font-size: 13px; color: var(--text);
    background: var(--input); border: 1px solid var(--stroke-strong); border-radius: 6px; padding: 4px 8px;
  }
  .seg { display: inline-flex; border: 1px solid var(--stroke-strong); border-radius: 6px; overflow: hidden; }
  .seg button {
    border: 0; background: transparent; padding: 4px 10px; font-size: 13px; cursor: pointer; color: var(--text-2);
  }
  .seg button[aria-pressed="true"] { background: var(--row-sel); color: var(--text); font-weight: 600; }

  /* ---------- desktop + dock ---------- */
  .desktop {
    flex: 1; position: relative; overflow: auto;
    background:
      radial-gradient(1200px 600px at 15% 0%, var(--desk-b), transparent 60%),
      radial-gradient(900px 500px at 100% 100%, var(--desk-a), transparent 60%),
      var(--desk-c);
    padding: 0 16px 24px;
  }
  .dock {
    position: sticky; top: 0; z-index: 2;
    display: flex; gap: 4px; align-items: stretch; flex-wrap: wrap;
    margin: 0 -16px 28px; padding: 4px 10px;
    background: var(--dock); backdrop-filter: blur(24px);
    border-bottom: 1px solid var(--stroke);
  }
  .band {
    display: flex; align-items: center; gap: 8px;
    border: 0; background: transparent; border-radius: 6px;
    padding: 4px 10px; cursor: pointer; text-align: left; min-height: 40px;
  }
  .band:hover { background: var(--row-hover); }
  .band:active, .band.open { background: var(--row-sel); }
  .band .ic { font-size: 16px; width: 20px; }
  .band .t { font-size: 12px; font-weight: 600; white-space: nowrap; }
  .band .s { font-size: 11px; color: var(--text-2); white-space: nowrap; }
  .band-group { display: inline-flex; align-items: stretch; gap: 1px; border-radius: 6px; }
  .band-group .band { border-radius: 6px; }
  .band.band-icon { padding: 4px 8px; gap: 0; }
  .band.band-icon .ic { font-size: 13px; width: 16px; }

  /* ---------- command palette window ---------- */
  .palette {
    width: min(860px, 100%); height: 540px; margin: 0 auto;
    display: flex; flex-direction: column;
    background: var(--surface); backdrop-filter: blur(30px);
    border: 1px solid var(--stroke-strong); border-radius: 8px;
    box-shadow: var(--shadow); overflow: hidden;
  }
  .pal-top {
    display: flex; align-items: center; gap: 8px; padding: 10px 12px;
    border-bottom: 1px solid var(--stroke);
  }
  .pal-top .lead {
    width: 32px; height: 32px; border: 0; border-radius: 4px; background: transparent;
    font-size: 14px; color: var(--text-2); flex: none;
  }
  .pal-top button.lead { cursor: pointer; }
  .pal-top button.lead:hover { background: var(--row-hover); color: var(--text); }
  .pal-top input {
    flex: 1; min-width: 0; font: inherit; font-size: 16px; color: var(--text);
    background: transparent; border: 0; outline: none; padding: 6px 4px;
  }
  .pal-top input::placeholder { color: var(--text-3); }
  .pal-top input:disabled { cursor: default; }
  .pal-body { flex: 1; min-height: 0; display: flex; }
  .list { flex: 1; min-width: 0; overflow-y: auto; padding: 4px; }
  .list.with-details { flex: 1 1 auto; border-right: 1px solid var(--stroke); }
  .row {
    position: relative; display: flex; align-items: center; gap: 12px;
    padding: 8px 12px; border-radius: 4px; cursor: default; min-height: 52px;
  }
  .row:hover { background: var(--row-hover); }
  .row.sel { background: var(--row-sel); }
  .row.sel::before {
    content: ""; position: absolute; left: 0; top: 50%; width: 3px; height: 16px;
    margin-top: -8px; border-radius: 2px; background: var(--accent);
  }
  .row > .ic { font-size: 18px; width: 24px; flex: none; color: var(--text); }
  .row .txt { flex: 1; min-width: 0; }
  .row .ti { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .su { font-size: 12px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tags { display: flex; gap: 4px; flex: none; flex-wrap: nowrap; }
  .tag {
    font-size: 11.5px; padding: 1px 7px; border-radius: 4px; white-space: nowrap;
    background: var(--tag-bg); border: 1px solid var(--tag-stroke); color: var(--text-2);
  }
  .tag.ok { background: rgba(16, 185, 129, .14); border-color: rgba(16, 185, 129, .38); color: #10b981; }
  .tag.accent { background: rgba(56, 189, 248, .14); border-color: rgba(56, 189, 248, .38); color: var(--accent); }
  .tag.warn { background: rgba(245, 158, 11, .15); border-color: rgba(245, 158, 11, .4); color: #d97706; }
  .tag.danger { background: rgba(244, 63, 94, .15); border-color: rgba(244, 63, 94, .42); color: #e11d48; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .tag.warn { color: #fbbf24; }
    :root:not([data-theme="light"]) .tag.danger { color: #fb7185; }
    :root:not([data-theme="light"]) .tag.ok { color: #34d399; }
  }
  :root[data-theme="dark"] .tag.warn { color: #fbbf24; }
  :root[data-theme="dark"] .tag.danger { color: #fb7185; }
  :root[data-theme="dark"] .tag.ok { color: #34d399; }
  .empty { padding: 32px; text-align: center; color: var(--text-3); }
  .sec-hdr {
    font-size: 12px; font-weight: 600; color: var(--text-2);
    padding: 10px 12px 4px; margin-top: 6px; border-top: 1px solid var(--stroke);
  }
  .sec-hdr:first-child { margin-top: 0; border-top: 0; padding-top: 6px; }

  /* Same content width as Command Palette's details pane at its default size (~345 px); wider images get clipped */
  .details { flex: 0 0 381px; min-width: 0; overflow-y: auto; overflow-x: hidden; padding: 16px 18px; }
  .details h2 { font-size: 18px; font-weight: 600; margin: 0 0 10px; }

  .content { flex: 1; overflow-y: auto; padding: 16px 20px; display: flex; flex-direction: column; gap: 10px; }
  .chart { display: block; width: 100%; height: auto; }
  .pomo-card { display: block; width: 100%; max-width: 480px; height: auto; margin: 0 auto; border-radius: 12px; }
  .prayer-card-wrap { padding: 6px 8px 4px; }
  .prayer-card { display: block; width: 100%; height: auto; border-radius: 12px; cursor: pointer; }

  /* Adaptive Card FormContent mock */
  .form-card {
    background: var(--input); border: 1px solid var(--stroke); border-radius: 8px;
    padding: 14px 16px; display: flex; flex-direction: column; gap: 12px;
  }
  .form-card.compact { padding: 10px 12px; gap: 8px; max-width: 480px; width: 100%; margin: 0 auto; }
  .form-title { font-size: 15px; font-weight: 600; margin: 0; }
  .form-desc { font-size: 12.5px; color: var(--text-2); margin: 0; }
  .form-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .form-field { display: flex; flex-direction: column; gap: 5px; }
  .form-label { font-size: 12.5px; font-weight: 600; color: var(--text-2); }
  .form-input {
    font: inherit; font-size: 13.5px; color: var(--text);
    background: var(--surface); border: 1px solid var(--stroke-strong); border-radius: 6px; padding: 7px 10px;
  }
  .form-input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .form-toggle { display: flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer; }
  .form-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .form-card.compact .form-actions { justify-content: center; }
  .form-btn {
    display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--stroke-strong);
    background: var(--tag-bg); color: var(--text); border-radius: 6px; padding: 6px 12px;
    font-size: 13px; font-weight: 500; cursor: pointer;
  }
  .form-btn:hover { background: var(--row-sel); }
  .form-btn.primary { background: var(--accent); border-color: transparent; color: #ffffff; font-weight: 600; }
  :root[data-theme="dark"] .form-btn.primary { color: #0b0d14; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .form-btn.primary { color: #0b0d14; } }
  .form-btn.primary:hover { filter: brightness(1.08); }
  .form-err { font-size: 12px; color: #e11d48; margin: 0; }

  .md { font-size: 13.5px; color: var(--text); }
  .md p { margin: 0 0 10px; }
  .md h3 { font-size: 15px; font-weight: 600; margin: 8px 0 6px; }
  .md em { color: var(--text-2); }
  .md table { border-collapse: collapse; width: 100%; margin: 0 0 10px; font-size: 13px; }
  .md th, .md td { padding: 5px 8px; border-bottom: 1px solid var(--stroke); }
  .md th { font-weight: 600; background: var(--md-table); }

  .pal-bar {
    display: flex; align-items: center; gap: 8px; padding: 6px 10px 6px 14px;
    border-top: 1px solid var(--stroke); font-size: 12.5px; color: var(--text-2); min-height: 44px;
  }
  .bar-left { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1; }
  .bar-left span:last-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar-right { display: flex; align-items: center; gap: 4px; flex: none; }
  .bar-btn {
    display: inline-flex; align-items: center; gap: 6px; border: 0; background: transparent;
    padding: 5px 8px; border-radius: 4px; cursor: pointer; color: var(--text);
  }
  .bar-btn:hover { background: var(--row-hover); }
  .bar-btn[hidden] { display: none; }
  kbd {
    font: inherit; font-size: 11px; padding: 1px 6px; border-radius: 4px;
    background: var(--kbd); border: 1px solid var(--stroke); color: var(--text-2);
  }
  .sep { width: 1px; height: 18px; background: var(--stroke-strong); margin: 0 4px; }

  /* ---------- context menu + toast ---------- */
  .menu {
    position: fixed; z-index: 20; min-width: 240px; max-width: 360px; padding: 4px;
    background: var(--menu); border: 1px solid var(--stroke-strong); border-radius: 8px;
    box-shadow: var(--shadow);
  }
  .menu[hidden] { display: none; }
  .menu button {
    display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
    border: 0; background: transparent; padding: 7px 10px; border-radius: 4px; cursor: pointer; font-size: 13px;
  }
  .menu button:hover, .menu button.sel { background: var(--row-sel); }
  .menu .ic { width: 16px; font-size: 14px; color: var(--text-2); }
  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 30;
    background: var(--menu); color: var(--text); border: 1px solid var(--stroke-strong);
    border-radius: 6px; padding: 8px 14px; font-size: 13px; box-shadow: var(--shadow); max-width: calc(100% - 32px);
  }
  .toast[hidden] { display: none; }
  .win-notif {
    position: fixed; right: 20px; bottom: 20px; z-index: 35; width: 340px;
    background: var(--menu); color: var(--text); border: 1px solid var(--stroke-strong);
    border-radius: 8px; padding: 12px 14px; box-shadow: var(--shadow);
  }
  .win-notif[hidden] { display: none; }
  .win-notif-top { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-2); margin-bottom: 6px; }
  .win-notif-top button { margin-left: auto; border: 0; background: transparent; cursor: pointer; color: var(--text-2); font-size: 15px; padding: 0 4px; border-radius: 4px; }
  .win-notif-top button:hover { background: var(--row-hover); color: var(--text); }
  .win-notif-title { font-weight: 600; font-size: 14px; margin-bottom: 2px; }
  .win-notif-body { font-size: 12.5px; color: var(--text-2); }
  .hint { text-align: center; color: var(--text-2); font-size: 12.5px; margin: 14px 0 0; }

  @media (max-width: 640px) {
    .palette { height: 600px; }
    .pal-body.split { flex-direction: column; }
    .list.with-details { flex: 0 0 50%; border-right: 0; border-bottom: 1px solid var(--stroke); }
    .tags .tag:nth-child(n+2) { display: none; }
  }
</style>
</head>
<body>
<header class="toolbar">
  <div class="brand">DockPulse UI Preview <span class="badge">approximate · fake data</span></div>
  <div class="controls">
    <div class="seg" id="themeSeg" role="group" aria-label="Theme">
      <button data-theme-btn="auto" aria-pressed="true">Auto</button>
      <button data-theme-btn="light" aria-pressed="false">Light</button>
      <button data-theme-btn="dark" aria-pressed="false">Dark</button>
    </div>
    <label>Scenario
      <select id="scenario">
        <option value="normal">Normal</option>
        <option value="ai_limit">AI Usage: Claude 0% (limit reached)</option>
        <option value="ai_nosignin">AI Usage: Codex no sessions, agy not installed</option>
        <option value="bt_fallback">Bluetooth: pinned device disconnected</option>
        <option value="coffee_due">Daily checklist: Coffee time (10:05)</option>
        <option value="pomodoro_running">Pomodoro: running live (Focus 2/4)</option>
        <option value="prayertime">Prayer time reached (notification)</option>
        <option value="tehran">Tehran / Jafari method</option>
        <option value="low">Low battery + charging</option>
        <option value="nodevices">No wireless devices</option>
        <option value="notraffic">No network traffic yet</option>
        <option value="folder_missing">Working folder missing</option>
      </select>
    </label>
    <label>Clock <input type="time" id="clock" value="14:11"></label>
  </div>
</header>

<main class="desktop">
  <nav class="dock" id="dock" aria-label="Dock"></nav>

  <section class="palette" id="palette" aria-label="Command Palette">
    <div class="pal-top" id="palTop"></div>
    <div class="pal-body" id="palBody"></div>
    <div class="pal-bar">
      <div class="bar-left"><span class="ic" id="barIcon"></span><span id="barTitle"></span></div>
      <div class="bar-right">
        <button class="bar-btn" id="primaryBtn"><span id="primaryName"></span><kbd>↵</kbd></button>
        <span class="sep" id="barSep"></span>
        <button class="bar-btn" id="actionsBtn">Actions <kbd>Ctrl</kbd><kbd>K</kbd></button>
      </div>
    </div>
  </section>

  <p class="hint">Click a Dock band to open its page · click ▶/⏸ on Pomodoro to start/pause · right-click a band for its menu · click selects a row, double-click or Enter runs it · Esc goes back</p>
</main>

<div class="menu" id="menu" role="menu" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>
<div class="win-notif" id="winNotif" role="alert" hidden>
  <div class="win-notif-top">
    <span class="ic" id="wnIcon"></span>
    <span>DockPulse · Windows Notification</span>
    <button id="wnClose" title="Dismiss" aria-label="Dismiss">✕</button>
  </div>
  <div class="win-notif-title" id="wnTitle"></div>
  <div class="win-notif-body" id="wnBody"></div>
</div>

<script>
"use strict";

/* =====================================================================
   Formatting helpers: ports of the C# formatters, so texts match
   ===================================================================== */
const KB = 1024, MB = KB * 1024, GB = MB * 1024;
const pad2 = n => String(n).padStart(2, "0");
const hhmm = mins => pad2(Math.floor(((mins % 1440) + 1440) % 1440 / 60)) + ":" + pad2(((mins % 60) + 60) % 60);
const deg = x => String(Number(x.toFixed(1)));               // C# "0.#"
const fixed2 = x => x.toFixed(2);                              // C# "0.00"

// NetworkUsageService.FormatBytes
function formatBytes(bytes) {
  const units = ["B", "KB", "MB", "GB", "TB"];
  let v = bytes, i = 0;
  while (v >= 1024 && i < units.length - 1) { v /= 1024; i++; }
  return v.toFixed(i >= 3 ? 2 : (i >= 2 ? 1 : 0)) + " " + units[i];
}
// NetworkChartRenderer.FormatShortAxis
function formatShortAxis(bytes) {
  if (bytes === 0) return "0";
  const units = ["B", "KB", "MB", "GB", "TB"];
  let v = bytes, i = 0;
  while (v >= 1024 && i < units.length - 1) { v /= 1024; i++; }
  const d = v >= 100 ? 0 : (Math.abs(v - Math.round(v)) < 0.05 ? 0 : 1);
  return v.toFixed(d) + " " + units[i];
}
// NetworkChartRenderer.ComputeNiceCeiling
function niceCeiling(max) {
  if (max === 0) return 10 * MB;
  let unit = KB;
  if (max >= GB * 1024) unit = GB * 1024; else if (max >= GB) unit = GB; else if (max >= MB) unit = MB;
  const inUnits = max / unit;
  const mag = Math.pow(10, Math.floor(Math.log10(Math.max(inUnits, 0.1))));
  const n = inUnits / mag;
  const nice = n <= 1 ? 1 : n <= 1.5 ? 1.5 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 4 ? 4 : n <= 5 ? 5 : n <= 8 ? 8 : 10;
  return Math.ceil(nice * mag * unit);
}
function formatPeakHour(hourly) {
  let best = -1, bestTotal = 0;
  hourly.forEach((b, i) => { const t = b.rx + b.tx; if (t > bestTotal) { bestTotal = t; best = i; } });
  return best >= 0 ? `${pad2(best)}:00 (${formatBytes(bestTotal)})` : "No traffic yet";
}
function formatPeakDay(daily, monthAbbr) {
  let best = -1, bestTotal = 0;
  daily.forEach((b, i) => { const t = b.rx + b.tx; if (t > bestTotal) { bestTotal = t; best = i; } });
  return best >= 0 ? `${monthAbbr} ${best + 1} (${formatBytes(bestTotal)})` : "No traffic yet";
}
// WirelessBatteryService glyphs
function batteryGlyph(pct, charging) {
  if (charging) return "";
  if (pct >= 95) return ""; if (pct >= 85) return ""; if (pct >= 75) return "";

function seeded(seed) {
  return () => {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function buildNetwork() {
  const now = nowDate();
  const curHour = now.getHours(), minute = now.getMinutes(), curDay = now.getDate();
  const daysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
  const none = state.scenario === "notraffic";
  const rnd = seeded(7);

  const hourly = [];
  for (let h = 0; h < 24; h++) {
    const a = rnd(), b = rnd();
    let total = 0;
    if (!none && h <= curHour) {
      total = (h >= 8 ? 0.25 + a * 1.1 : 0.02 + a * 0.12) * GB;
      if (h === curHour) total *= Math.max(0.05, minute / 60);
    }
    const rx = Math.round(total * (0.84 + b * 0.08));
    hourly.push({ label: pad2(h), rx, tx: Math.round(total) - rx });
  }
  const todayRx = hourly.reduce((s, x) => s + x.rx, 0), todayTx = hourly.reduce((s, x) => s + x.tx, 0);

  const daily = [];
  for (let d = 1; d <= daysInMonth; d++) {
    const a = rnd(), b = rnd();
    let rx = 0, tx = 0;
    if (!none && d < curDay) {
      const total = (1.3 + a * 2.4) * GB;
      rx = Math.round(total * (0.84 + b * 0.08)); tx = Math.round(total) - rx;
    } else if (d === curDay) { rx = todayRx; tx = todayTx; }
    daily.push({ label: String(d), rx, tx });
  }
  const monthRx = daily.reduce((s, x) => s + x.rx, 0), monthTx = daily.reduce((s, x) => s + x.tx, 0);

  const adapters = none ? [] : [
    { name: "HomeNet-5G", active: true, share: 0.86 },
    { name: "Ethernet", active: false, share: 0.14 },
  ].map(ad => {
    const days = daily.map((x, i) => {
      const share = (i + 1 === curDay) ? (ad.active ? 1 : 0) : ad.share;
      return { label: x.label, rx: Math.round(x.rx * share), tx: Math.round(x.tx * share) };
    });
    const today = days[curDay - 1];
    const rxM = days.reduce((s, x) => s + x.rx, 0), txM = days.reduce((s, x) => s + x.tx, 0);
    return {
      name: ad.name, active: ad.active, daily: days,
      rxToday: today.rx, txToday: today.tx, totalToday: today.rx + today.tx,
      rxMonth: rxM, txMonth: txM, totalMonth: rxM + txM,
    };
  });

  const updated = new Date(now.getTime() - 83 * 1000);
  return {
    hourly, daily, curHour, curDay, adapters,
    monthAbbr: now.toLocaleString("en-US", { month: "short" }),
    monthLabel: now.toLocaleString("en-US", { month: "short" }) + " " + now.getFullYear(),
    rxToday: todayRx, txToday: todayTx, totalToday: todayRx + todayTx,
    rxMonth: monthRx, txMonth: monthTx, totalMonth: monthRx + monthTx,
    updatedAt: `${pad2(updated.getHours())}:${pad2(updated.getMinutes())}:${pad2(updated.getSeconds())}`,
  };
}

function buildPrayer() {
  const region = REGIONS.find(r => r.id === state.prayer.regionId);
  const method = METHODS.find(m => m.id === state.prayer.methodId);
  const school = state.prayer.asr;
  const p = profileFor(region);
  const now = state.clock;
  const asrT = school === "Hanafi" ? p.asrHan : p.asrStd;
  const maghrib = method.twilightMaghrib ? p.sunset + 19 : p.sunset;
  const isha = method.ishaMin ? p.sunset + method.ishaMin : (method.twilightMaghrib ? p.ishaTwi : p.ishaStd);
  const entries = [
    { name: "Fajr", t: p.fajr, obligatory: true },
    { name: "Sunrise", t: p.sunrise, obligatory: false },
    { name: "Dhuhr", t: p.dhuhr, obligatory: true },
    { name: "Asr", t: asrT, obligatory: true },
    ...(method.twilightMaghrib ? [{ name: "Sunset", t: p.sunset, obligatory: false }] : []),
    { name: "Maghrib", t: maghrib, obligatory: true },
    { name: "Isha", t: isha, obligatory: true },
  ];
  const obligatory = entries.filter(e => e.obligatory);
  let next = obligatory.find(e => e.t > now);
  let tomorrow = false;
  if (!next) { next = obligatory[0]; tomorrow = true; }
  const current = [...obligatory].reverse().find(e => e.t <= now);
  for (const e of entries) {
    e.isPassed = e.t <= now;
    e.isNext = !tomorrow && e === next;
    e.isCurrent = e === current;
  }
  const exactNowPrayer = obligatory.find(e => e.t === now);
  const until = (tomorrow ? next.t + 1440 : next.t) - now;
  const cardPrayerName = exactNowPrayer ? exactNowPrayer.name : next.name;
  const cardLabel = exactNowPrayer ? "Prayer Time" : "Time Left";
  const cardPill = exactNowPrayer ? `Now • ${hhmm(exactNowPrayer.t)}` : `${Math.floor(until / 60)} Hour ${until % 60} min`;
  const milestones = [
    { key: "fajr", name: "Fajr", t: p.fajr },
    { key: "sunrise", name: "Sunrise", t: p.sunrise, arrow: "up" },
    { key: "dhuhr", name: "Dhuhr", t: p.dhuhr },
    { key: "asr", name: "Asr", t: asrT },
    { key: "maghrib", name: "Maghrib", t: maghrib, arrow: "down" },
    { key: "isha", name: "Isha", t: isha },
  ];
  const d = nowDate();
  return {
    region, method, school, entries, next, tomorrow, now, until,
    sunriseT: p.sunrise, sunsetT: p.sunset, maghribT: maghrib,
    cardPrayerName, cardLabel, cardPill, milestones,
    countdownShort: exactNowPrayer ? `Now: ${exactNowPrayer.name}`
      : until < 60 ? `${until}m to ${next.name}`
      : (until % 60 === 0 ? `${Math.floor(until / 60)}h to ${next.name}` : `${Math.floor(until / 60)}h ${until % 60}m to ${next.name}`),
    countdownLong: until <= 0 ? "Starting now"
      : until < 60 ? `in ${until}m`
      : (until % 60 === 0 ? `in ${Math.floor(until / 60)}h` : `in ${Math.floor(until / 60)}h ${until % 60}m`),
    regionNow: `${d.toLocaleString("en-US", { weekday: "short" })}, ${d.toLocaleString("en-US", { month: "short" })} ${d.getDate()} • ${hhmm(now)}`,
  };
}

const formatMmSs = sec => `${pad2(Math.floor(Math.max(0, sec) / 60))}:${pad2(Math.max(0, sec) % 60)}`;
function pomoPhaseSubtitle(p) {
  if (p.phase === "focus") return `Focus ${p.sessionIndex}/${p.sessionsPerCycle}`;
  if (p.phase === "short") return "Short break";
  return "Long break";
}
function pomoDurationSec(p, phase) {
  if (phase === "focus") return p.focusMin * 60;
  if (phase === "short") return p.shortBreakMin * 60;
  return p.longBreakMin * 60;
}
function pomoToggle() {
  const p = state.pomodoro;
  if (p.remainingSec <= 0) {
    p.totalSec = pomoDurationSec(p, p.phase);
    p.remainingSec = p.totalSec;
  }
  p.running = !p.running;
}
function pomoAddMinute() {
  const p = state.pomodoro;
  p.remainingSec += 60;
  p.totalSec = Math.max(p.totalSec, p.remainingSec);
  toast("Added +1 min");
}
function pomoReset() {
  const p = state.pomodoro;
  p.running = false;
  p.totalSec = pomoDurationSec(p, p.phase);
  p.remainingSec = p.totalSec;
}
function pomoAdvance(completedByTimer) {
  const p = state.pomodoro;
  if (p.phase === "focus") {
    if (completedByTimer) {
      p.todaySessions += 1;
      p.weekDays[p.weekDays.length - 1].sessions += 1;
    }
    p.phase = p.sessionIndex >= p.sessionsPerCycle ? "long" : "short";
  } else if (p.phase === "short") {
    p.sessionIndex = Math.min(p.sessionsPerCycle, p.sessionIndex + 1);
    p.phase = "focus";
  } else {
    p.sessionIndex = 1;
    p.phase = "focus";
  }
  p.totalSec = pomoDurationSec(p, p.phase);
  p.remainingSec = p.totalSec;
  p.running = false;
  if (completedByTimer && p.notify) {
    showWinNotifCustom("\uE916", "Pomodoro — Phase Complete", `Up next: ${pomoPhaseSubtitle(p)} (${formatMmSs(p.totalSec)})`);
  }
}

  workFolderSettings() {
    const wf = state.workFolder;
    return {
      kind: "content",
      name: "Change Folder",
      title: "Working Folder",
      icon: "\uE8B7",
      content: [{
        form: {
          title: "Working Folder",
          desc: "The Dock band opens this folder in File Explorer with one click.",
          fields: [
            { id: "path", type: "text", label: "Folder path", value: wf.path, placeholder: "C:\\Dev\\MyProject" },
          ],
          actions: [
            { id: "save", label: "Save Folder", primary: true, submit: true },
            { id: "cancel", label: "Cancel" },
          ],
          onAction(actionId, vals) {
            if (actionId === "cancel") { goBack(); return; }
            const p = String(vals.path || "").trim().replace(/^"|"$/g, "").replace(/[\\/]+$/, "");
            if (!p) return "Enter a folder path.";
            // The real form checks Directory.Exists; the mock treats paths containing "missing" as not found
            if (/missing/i.test(p)) return `Folder not found: ${p}`;
            wf.path = /^[A-Za-z]:$/.test(p) ? p + "\\" : p;
            goBack();
            toast(`Working folder: ${wf.path}`);
          },
        },
      }],
    };
  },

  wireless() {
    const w = resolveWireless();
    const items = [];
    if (w.list.length === 0) {
      items.push({ icon: "", title: "No wireless devices with battery reporting found", subtitle: "Connect a Bluetooth/BLE device, Logitech LIGHTSPEED/Bolt/Unifying device, or Xbox controller", cmd: uri("Open Bluetooth Settings", "ms-settings:bluetooth") });
    } else {
      if (w.pinnedMissing && w.active) {
        items.push({
          section: "Dock Selection",
          icon: "\uE7BA",
          title: `${w.pinnedName} (Disconnected)`,
          subtitle: `Pinned for Dock • Falling back to ${w.active.name}`,
          tags: [{ text: "Pinned", tone: "warn" }, { text: "Offline", tone: "danger" }],
          cmd: { name: `Pin ${w.active.name} Instead`, run: () => { state.wireless = { pinnedId: w.active.id, pinnedName: w.active.name }; toast(`Dock now shows ${w.active.name}`); } },
          more: [
            { icon: "\uE72C", ...refresh("Refresh Battery Levels") },
            { icon: "\uE713", ...uri("Open Bluetooth Settings", "ms-settings:bluetooth") },
          ],
        });
      }
      for (const d of w.list) {
        const isPinned = d.id === state.wireless.pinnedId;
        const isFallback = w.pinnedMissing && w.active && d.id === w.active.id;
        const tags = [`${d.pct}%`];
        if (isPinned && !w.pinnedMissing) tags.push({ text: "Shown in Dock", tone: "accent" });
        else if (isFallback) tags.push({ text: "Fallback in Dock", tone: "warn" });
        if (d.charging) tags.push({ text: "Wired / Charging", tone: "ok" });
        else if (d.pct <= 20) tags.push({ text: "Low Battery", tone: "danger" });
        items.push({
          section: w.pinnedMissing ? "Connected Devices" : "",
          icon: deviceGlyph(d.kind), title: d.name, tags,
          subtitle: d.detail ? `${d.conn} • ${d.detail}` : `${d.conn} • Battery: ${d.pct}%`,
          cmd: {
            name: isPinned ? "Shown in Dock" : "Show in Dock",
            run: () => {
              state.wireless = { pinnedId: d.id, pinnedName: d.name };
              toast(isPinned ? `${d.name} is already shown in Dock` : `Dock now shows ${d.name}`);
            },
          },
          more: [
            { icon: "\uE713", ...uri("Open Bluetooth Settings", "ms-settings:bluetooth") },
            { icon: "\uE72C", ...refresh("Refresh Battery Levels") },
          ],
        });
      }
    }
    items.push({ section: w.pinnedMissing ? "Actions" : "", icon: "", title: "Refresh Wireless Battery Levels", subtitle: "Force an immediate Bluetooth, GATT, Logitech HID++, and XInput scan", cmd: refresh("Refresh Now") });
    items.push({ section: w.pinnedMissing ? "Actions" : "", icon: "", title: "Open Windows Bluetooth & Devices Settings", subtitle: "Manage paired devices in Windows Settings", cmd: uri("Open Bluetooth Settings", "ms-settings:bluetooth") });
    return { kind: "list", name: "Wireless Devices", title: "Wireless Device Batteries", icon: "", placeholder: "Filter wireless devices...", items };
  },

  network() {
    const s = buildNetwork();
    const peakHour = formatPeakHour(s.hourly), peakDay = formatPeakDay(s.daily, s.monthAbbr);
    const avg = Math.floor(s.totalMonth / Math.max(1, s.curDay));
    // Details charts are rendered with isDarkTheme: true in NetworkUsagePage.cs, in both themes
    const small = { dark: true, w: 320, h: 185 };
    const charts = {
      today: { title: "Today Hourly", subtitle: `SINCE 00:00  |  PEAK: ${peakHour.toUpperCase()}`, buckets: s.hourly, active: s.curHour, ...small },
      month: { title: `${s.monthLabel} Daily`, subtitle: `PEAK: ${peakDay.toUpperCase()}  |  AVG: ${formatBytes(avg)}/DAY`, buckets: s.daily, active: s.curDay - 1, ...small },
    };
    const todayDetails = {
      title: "Today (Hourly Usage)",
      body: `![Today Hourly Usage](chart:today)\n\n**Total:** ${formatBytes(s.totalToday)}  \n**Download:** ${formatBytes(s.rxToday)}  •  **Upload:** ${formatBytes(s.txToday)}  \n**Peak Hour:** ${peakHour}  \n_Updated at ${s.updatedAt}_`,
    };
    const monthDetails = {
      title: `${s.monthLabel} (Daily Usage)`,
      body: `![Monthly Daily Usage](chart:month)\n\n**Total:** ${formatBytes(s.totalMonth)}  \n**Download:** ${formatBytes(s.rxMonth)}  •  **Upload:** ${formatBytes(s.txMonth)}  \n**Daily Average:** ${formatBytes(avg)}  •  **Peak Day:** ${peakDay}`,
    };
    const openDataSettings = { icon: "", ...uri("Open Data Usage Settings", "ms-settings:datausage") };
    const rowMore = [
      { icon: "", ...refresh("Refresh Now") },
    ];
    const items = [
      { icon: "", title: `Today (since 00:00): ${formatBytes(s.totalToday)}`, subtitle: `↓ ${formatBytes(s.rxToday)}   •   ↑ ${formatBytes(s.txToday)}`, tags: ["Today"], details: todayDetails, cmd: openDataSettings, more: rowMore },
      { icon: "", title: `This Month (${s.monthLabel}): ${formatBytes(s.totalMonth)}`, subtitle: `↓ ${formatBytes(s.rxMonth)}   •   ↑ ${formatBytes(s.txMonth)}`, tags: ["Month"], details: monthDetails, cmd: openDataSettings, more: rowMore },
    ];
    s.adapters.forEach((a, i) => {
      const key = "adapter" + i;
      const aPeak = formatPeakDay(a.daily, s.monthAbbr);
      charts[key] = { title: `${truncateChartTitle(a.name, 14)} (${s.monthLabel})`, subtitle: `TODAY: ${formatBytes(a.totalToday)}  |  PEAK: ${aPeak.toUpperCase()}`, buckets: a.daily, active: s.curDay - 1, ...small };
      const tags = [`Today: ${formatBytes(a.totalToday)}`, `Mo: ${formatBytes(a.totalMonth)}`];
      if (a.active) tags.unshift("Active");
      items.push({
        icon: a.active ? "" : "", title: a.name, tags, cmd: openDataSettings,
        subtitle: `Today ↓${formatBytes(a.rxToday)} ↑${formatBytes(a.txToday)}  |  Month ↓${formatBytes(a.rxMonth)} ↑${formatBytes(a.txMonth)}`,
        details: {
          title: a.name,
          body: `![${a.name} Monthly Usage](chart:${key})\n\n**Today:** ${formatBytes(a.totalToday)} (↓ ${formatBytes(a.rxToday)} • ↑ ${formatBytes(a.txToday)})  \n**This Month:** ${formatBytes(a.totalMonth)} (↓ ${formatBytes(a.rxMonth)} • ↑ ${formatBytes(a.txMonth)})  \n**Peak Day:** ${aPeak}`,
        },
        more: rowMore,
      });
    });
    items.push({ icon: "", title: "Refresh Network Usage", subtitle: `Last updated at ${s.updatedAt}`, details: todayDetails, cmd: refresh("Refresh Now") });
    items.push({ icon: "", title: "Open Windows Data Usage Settings", subtitle: "View per-app usage breakdown in Windows Settings", details: monthDetails, cmd: uri("Open Windows Data Usage", "ms-settings:datausage") });
    return { kind: "list", name: "Network Usage", title: "Network Data Usage (Today & This Month)", icon: "", placeholder: "Filter network adapters...", showDetails: true, charts, items };
  },

  method() {
    const school = state.prayer.asr;
    const schoolItem = {
      section: "Asr School",
      icon: "",
      title: `Asr School: ${school === "Hanafi" ? "Hanafi (2x shadow)" : "Standard (1x shadow)"}`,

    const methodItems = METHODS.map(m => {
      const sel = m.id === state.prayer.methodId;
      const ishaDesc = m.ishaMin > 0 ? `${m.ishaMin} min after Maghrib` : `${deg(m.isha)}°`;
      const maghribDesc = (m.maghrib || 0.833) > 0.834 ? `  •  Maghrib: ${deg(m.maghrib)}°` : "";

        section: "Calculation Methods",

  aiUsage() {
    const ai = buildAiUsage();
    const charts = {};
    const items = [];
    for (const p of ai.providers) {
      const key = "ai-" + p.id;
      charts[key] = { kind: "aiBars", provider: p, dark: true, w: 300, h: 175 };
      if (!p.signedIn) {
        const sub = p.unavailableSub || "No usage data available";
        items.push({
          icon: "\uE946",
          title: p.name,
          subtitle: sub,
          tags: [{ text: "No data", tone: "warn" }],
          details: {
            title: p.name,
            body: `![${p.name} Usage](chart:${key})\n\n**Status:** ${sub}  \n**Source:** ${p.plan}`,
          },
          cmd: refresh(`Refresh ${p.name}`),
          more: [
            { icon: "\uE72C", ...refresh("Refresh All AI Usage") },
            { icon: "\uE774", ...uri(`Open ${p.name} Settings`, p.url) },
          ],
        });
        continue;
      }
      const limitHit = p.shortPct === 0 || p.weekPct === 0;
      const age = p.age || "updated 3 min ago";
      items.push({
        icon: limitHit ? "\uE7BA" : "\uE99A",
        title: p.name,
        subtitle: limitHit
          ? `Limit reached  •  5h resets in ${p.shortReset}  •  Weekly resets in ${p.weekReset}  •  ${age}`
          : `5h resets in ${p.shortReset}  •  Weekly resets in ${p.weekReset}  •  ${age}`,
        tags: [
          { text: `5h ${p.shortPct}%`, tone: pctTone(p.shortPct) },
          { text: `Weekly ${p.weekPct}%`, tone: pctTone(p.weekPct) },
        ],
        details: {
          title: p.name,
          body: `![${p.name} Usage](chart:${key})\n\n**Source:** ${p.plan}  \n**5-Hour Window:** ${p.shortPct}% remaining (resets in ${p.shortReset})  \n**Weekly Limit:** ${p.weekPct}% remaining (resets in ${p.weekReset})  \n_${age}_`,
        },
        cmd: refresh(`Refresh ${p.name}`),
        more: [
          { icon: "\uE72C", ...refresh("Refresh All AI Usage") },
          { icon: "\uE774", ...uri(`Open ${p.name} Usage`, p.url) },
        ],
      });
    }
    items.push({
      icon: "\uE8C8",
      title: "Set up Claude usage",
      subtitle: "Copy status-line script & ~/.claude/settings.json snippet to clipboard",
      tags: [{ text: "Claude Code", tone: "accent" }],
      details: {
        title: "Set up Claude usage",
        body: "DockPulse reads Claude Code's local usage cache at `~/.claude/dockpulse-usage.json` and never edits `~/.claude/settings.json` or reads credentials.\n\n**1. Save the status-line script** to `C:/Users/<you>/.claude/dockpulse-statusline.ps1`.\n\n**2. Add `statusLine` to** `C:/Users/<you>/.claude/settings.json`.\n\nPress **Enter** on this row to copy both snippets to your clipboard.",
      },
      cmd: { name: "Copy Setup Snippet", run: () => toast("Copied Claude statusLine script & settings.json snippet") },
    });
    const fallbackKey = ai.tightest ? `ai-${ai.tightest.provider.id}` : `ai-${ai.providers[0].id}`;
    const fallbackTitle = ai.tightest ? ai.tightest.provider.name : ai.providers[0].name;
    items.push({
      icon: "\uE72C",
      title: "Refresh AI Usage",
      subtitle: `Last checked at ${ai.updatedAt}`,
      details: {
        title: `${fallbackTitle} (Tightest Limit)`,
        body: `![AI Usage](chart:${fallbackKey})\n\nReads local usage snapshots for Claude (~/.claude/dockpulse-usage.json) and Codex (~/.codex/sessions). Strictly offline.`,
      },
      cmd: refresh("Refresh AI Usage"),
    });
    return { kind: "list", name: "AI Usage", title: "AI Usage Limits", icon: "\uE99A", placeholder: "Filter AI providers...", showDetails: true, charts, items };
  },

  today() {
    const t = state.today;
    const due = isCoffeeDue();
    const waterTags = t.water >= t.waterGoal
      ? [{ text: `${t.water}/${t.waterGoal}`, tone: "ok" }, { text: "Goal Met", tone: "ok" }]
      : [{ text: `${t.water}/${t.waterGoal}`, tone: "accent" }];
    const coffeeTags = t.coffeeDone
      ? [{ text: "Done", tone: "ok" }, hhmm(t.coffeeTime)]
      : due
        ? [{ text: "Coffee Time", tone: "warn" }, hhmm(t.coffeeTime)]
        : [hhmm(t.coffeeTime)];

    const items = [
      {
        section: "Daily Habits",
        icon: "\uEB42",
        title: "Water",
        subtitle: `${t.water} of ${t.waterGoal} glasses today • Enter to add 1`,
        tags: waterTags,
        cmd: {
          name: "+1 Glass",
          run: () => {
            t.water += 1;
            toast(t.water === t.waterGoal ? `Water goal met (${t.water}/${t.waterGoal})!` : `Water: ${t.water}/${t.waterGoal}`);
          },
        },
        more: [
          { icon: "\uE738", name: "Remove 1 Glass", run: () => { if (t.water > 0) { t.water -= 1; toast(`Water: ${t.water}/${t.waterGoal}`); } else toast("Water is already 0"); } },
          { icon: "\uE72C", name: "Reset Water to 0", run: () => { t.water = 0; toast("Water reset to 0"); } },
          { icon: "\uE713", name: "Set Water Goal & Coffee Time", ...go("todaySettings") },
        ],
      },
      {
        section: "Daily Habits",
        icon: t.coffeeDone ? "\uE73A" : "\uEC32",
        title: "Coffee",
        subtitle: t.coffeeDone
          ? `Checked off • Scheduled for ${hhmm(t.coffeeTime)}`
          : due
            ? `Due since ${hhmm(t.coffeeTime)} • Enter to check off`
            : `Scheduled for ${hhmm(t.coffeeTime)} • Dock alerts at ${hhmm(t.coffeeTime)}`,
        tags: coffeeTags,
        cmd: {
          name: t.coffeeDone ? "Uncheck Coffee" : "Check Off Coffee",
          run: () => { t.coffeeDone = !t.coffeeDone; toast(t.coffeeDone ? "Coffee checked off" : "Coffee unchecked"); },
        },
        more: [
          { icon: "\uE713", name: "Set Coffee Time & Water Goal", ...go("todaySettings") },
        ],
      },
      ...t.items.map(it => ({
        section: "Daily Checklist (resets at 00:00)",
        icon: it.done ? "\uE73A" : "\uE739",
        title: it.title,
        subtitle: it.done ? "Completed today • Resets at midnight" : "Daily item • Enter to check off",
        tags: it.done ? [{ text: "Done", tone: "ok" }] : [],
        cmd: { name: it.done ? "Uncheck" : "Check Off", run: () => { it.done = !it.done; } },
        more: [
          { icon: "\uE70F", name: "Edit Item...", run: () => { t.editingId = it.id; openPage("todayEdit", false); } },
          { icon: "\uE74D", name: "Remove Item", run: () => { t.items = t.items.filter(x => x.id !== it.id); toast(`Removed “${it.title}”`); } },
        ],
      })),
      {
        section: "Manage",
        icon: "\uE710",
        title: "Add Daily Item",
        subtitle: "Open Adaptive Card form or type directly in the search box above",
        cmd: { name: "Add Item", ...go("todayAdd") },
      },
      {
        section: "Manage",
        icon: "\uE713",
        title: "Daily Settings",
        subtitle: `Coffee at ${hhmm(t.coffeeTime)}  •  Water goal: ${t.waterGoal} glasses`,
        tags: [hhmm(t.coffeeTime), `${t.waterGoal} glasses`],
        cmd: { name: "Edit Settings", ...go("todaySettings") },
      },
      {
        section: "Manage",
        icon: "\uE72C",
        title: "Reset Today's Checklist",
        subtitle: "Reset all items to unchecked and water to 0 (same as local midnight reset)",
        cmd: { name: "Reset Now", run: resetTodayMidnight },
      },
    ];

    return {
      kind: "list",
      name: "Today",
      title: "Today — Daily Checklist",
      icon: "\uE9D5",
      placeholder: "Filter items or type a new task to quick-add...",
      items,
      dynamicItems(raw) {
        const trimmed = raw.trim();
        if (!trimmed) return [];
        const exists = t.items.some(x => x.title.toLowerCase() === trimmed.toLowerCase());
        if (exists) return [];
        return [{
          section: "Quick Add",
          icon: "\uE710",
          title: `Add “${trimmed}”`,
          subtitle: "Add as a daily item (resets every day at 00:00)",
          tags: [{ text: "Quick Add", tone: "accent" }],
          cmd: {
            name: "Add Item",
            run: () => {
              t.items.push({ id: t.nextId++, title: trimmed, done: false });
              state.filter = "";
              toast(`Added “${trimmed}”`);
            },
          },
        }];
      },
    };
  },

      name: "Add Daily Item",
      title: "Add Daily Checklist Item",
      icon: "\uE710",
      content: [{
        form: {
          title: "New Daily Item",
          desc: "Daily items stay in your list and reset to unchecked every day at 00:00 local time.",
          fields: [
            { id: "title", type: "text", label: "Item title", placeholder: "e.g. Review pull requests", value: "", required: true },
          ],
          actions: [
            { id: "save", label: "Add Daily Item", primary: true, submit: true },

          onAction(actionId, vals) {

            goBack();
            toast(`Added “${title}”`);
          },
        },
      }],

    return {
      kind: "content",
      name: "Edit Daily Item",
      title: "Edit Daily Checklist Item",
      icon: "\uE70F",
      content: [{
        form: {

      kind: "content",
      name: "Pomodoro Settings",
      title: "Pomodoro Settings",

      content: [{
        form: {
          title: "Timer Durations & Cycle",

          fields: [
            { row: [
              { id: "focusMin", type: "number", label: "Focus (minutes)", value: p.focusMin, min: 1, max: 120 },
              { id: "shortBreakMin", type: "number", label: "Short break (minutes)", value: p.shortBreakMin, min: 1, max: 60 },
            ] },
            { row: [
              { id: "longBreakMin", type: "number", label: "Long break (minutes)", value: p.longBreakMin, min: 1, max: 60 },
              { id: "sessionsPerCycle", type: "number", label: "Sessions before long break", value: p.sessionsPerCycle, min: 1, max: 8 },
            ] },
            { id: "notify", type: "toggle", label: "Send Windows notification when phase ends", value: p.notify },
          ],
          actions: [
            { id: "save", label: "Save Settings", primary: true, submit: true },
            { id: "cancel", label: "Cancel" },
          ],
          onAction(actionId, vals) {
            if (actionId === "cancel") { goBack(); return; }
            const focus = parseInt(vals.focusMin, 10);
            const sb = parseInt(vals.shortBreakMin, 10);
            const lb = parseInt(vals.longBreakMin, 10);
            const cyc = parseInt(vals.sessionsPerCycle, 10);
            if ([focus, sb, lb, cyc].some(n => !Number.isFinite(n) || n < 1)) {
              return "All durations and cycle count must be 1 or greater.";
            }
            const atFull = !p.running && p.remainingSec === p.totalSec;
            p.focusMin = focus;
            p.shortBreakMin = sb;
            p.longBreakMin = lb;
            p.sessionsPerCycle = Math.min(8, cyc);
            p.sessionIndex = Math.min(p.sessionIndex, p.sessionsPerCycle);
            p.notify = Boolean(vals.notify);
            if (atFull) {
              p.totalSec = pomoDurationSec(p, p.phase);
              p.remainingSec = p.totalSec;
            }
            goBack();
            toast(`Saved: ${p.focusMin}/${p.shortBreakMin}/${p.longBreakMin}m (${p.sessionsPerCycle}×)`);
          },
        },
      }],
    };
  },
};
