name: Build MSIX Bundle

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Locate extension project
        id: proj
        shell: pwsh
        run: |
          $csproj = Get-ChildItem -Recurse -Filter "*.csproj" | Select-Object -First 1
          if (-not $csproj) { throw "No .csproj found!" }
          "dir=$($csproj.DirectoryName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "file=$($csproj.Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "name=$($csproj.BaseName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build x64 MSIX
        working-directory: ${{ steps.proj.outputs.dir }}
        run: >
          dotnet build ${{ steps.proj.outputs.file }}
          --configuration Release
          -p:Platform=x64
          -p:GenerateAppxPackageOnBuild=true
          -p:AppxPackageSigningEnabled=false
          -p:AppxBundle=Never
          -p:AppxPackageDir="AppPackages\x64\"

      - name: Build ARM64 MSIX
        working-directory: ${{ steps.proj.outputs.dir }}
        run: >
          dotnet build ${{ steps.proj.outputs.file }}
          --configuration Release
          -p:Platform=ARM64
          -p:GenerateAppxPackageOnBuild=true
          -p:AppxPackageSigningEnabled=false
          -p:AppxBundle=Never
          -p:AppxPackageDir="AppPackages\ARM64\"

      - name: Create .msixbundle for Microsoft Store
        working-directory: ${{ steps.proj.outputs.dir }}
        shell: pwsh
        run: |
          $x64Msix = Get-ChildItem -Path "AppPackages\x64" -Recurse -Filter "*.msix" | Select-Object -First 1
          $arm64Msix = Get-ChildItem -Path "AppPackages\ARM64" -Recurse -Filter "*.msix" | Select-Object -First 1

          @(
            "[Files]"
            "`"$($x64Msix.FullName)`" `"$($x64Msix.Name)`""
            "`"$($arm64Msix.FullName)`" `"$($arm64Msix.Name)`""
          ) | Set-Content -Path "bundle_mapping.txt" -Encoding ASCII

          $makeAppx = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\makeappx.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1

          $bundleName = "${{ steps.proj.outputs.name }}_Bundle.msixbundle"
          & $makeAppx.FullName bundle /f bundle_mapping.txt /p $bundleName /o

      - name: Create self-signed MSIX for local testing
        working-directory: ${{ steps.proj.outputs.dir }}
        shell: pwsh
        run: |
          [xml]$manifest = Get-Content "Package.appxmanifest"
          $publisher = $manifest.Package.Identity.Publisher
          Write-Host "Signing test packages for Publisher: $publisher"

          $cert = New-SelfSignedCertificate `
            -Type Custom `
            -Subject $publisher `
            -KeyUsage DigitalSignature `
            -FriendlyName "DockPulse Local Test" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")

          $pwd = ConvertTo-SecureString -String "TestPass123!" -Force -AsPlainText
          New-Item -ItemType Directory -Force -Path "LocalTest" | Out-Null
          Export-PfxCertificate -Cert $cert -FilePath "LocalTest\temp.pfx" -Password $pwd | Out-Null
          Export-Certificate -Cert $cert -FilePath "LocalTest\DockPulse_Test.cer" | Out-Null

          $signTool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1

          $x64Msix = Get-ChildItem -Path "AppPackages\x64" -Recurse -Filter "*.msix" | Select-Object -First 1
          $arm64Msix = Get-ChildItem -Path "AppPackages\ARM64" -Recurse -Filter "*.msix" | Select-Object -First 1

          Copy-Item $x64Msix.FullName "LocalTest\DockPulse_x64_TestSigned.msix"
          Copy-Item $arm64Msix.FullName "LocalTest\DockPulse_ARM64_TestSigned.msix"

          & $signTool.FullName sign /fd SHA256 /f "LocalTest\temp.pfx" /p "TestPass123!" "LocalTest\DockPulse_x64_TestSigned.msix"
          & $signTool.FullName sign /fd SHA256 /f "LocalTest\temp.pfx" /p "TestPass123!" "LocalTest\DockPulse_ARM64_TestSigned.msix"

          Remove-Item "LocalTest\temp.pfx" -Force

      - name: Upload Store Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Extension-Store-Bundle
          path: |
            ${{ steps.proj.outputs.dir }}\*_Bundle.msixbundle

      - name: Upload Local Test Signed Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DockPulse-Local-Test
          path: |
            ${{ steps.proj.outputs.dir }}\LocalTest\DockPulse_Test.cer
            ${{ steps.proj.outputs.dir }}\LocalTest\*.msix
